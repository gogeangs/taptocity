name: taptocity
description: 탭투시티 — 재 속의 등불 (네이티브)
publish_to: none
version: 2.0.0+105

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10
  audioplayers: ^6.1.0
  http: ^1.2.2
  web: ^1.1.0
  webview_flutter: ^4.10.0
  app_links: ^6.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # 그림과 글꼴은 저장소의 원본(assets/illustrated, fonts)을 빌드 때 복사해 쓴다 (tool/prepare_assets.sh)
  assets:
    - assets/illustrated/
    # 웹툰 컷 (하위 폴더는 따로 적어야 묶인다)
    - assets/illustrated/cuts/
    # 소리: 웹의 합성음을 렌더링한 음원 (tool/gen_audio.cjs)
    - assets/audio/sfx/
    - assets/audio/music/
  fonts:
    - family: TTCSans
      fonts:
        - asset: assets/fonts/ttc-sans.ttf
