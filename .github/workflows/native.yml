# 탭투시티 네이티브(Flutter) — 검사·테스트·안드로이드 APK·웹 미리보기
# native/ 가 바뀌면 자동으로 돈다. 결과:
#   - 실행 화면 아래 Artifacts 의 'taptocity-apk' → 휴대폰에 설치하는 미리보기 APK
#   - https://gogeangs.github.io/taptocity/native-play/ → 브라우저 미리보기
name: Native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.TTC_KEYSTORE_B64 != '' }}
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      # 앱(웹 주소가 없는 곳)에서 Firebase 키가 통하는지 확인 — 계정을 만들지 않는 조회만 한다
      - name: 클라우드 키 확인
        continue-on-error: true
        run: |
          K=AIzaSyAzqQSuc2RtaenC7FD8vgtc8O-Q8ppL37k
          B='{"identifier":"probe@example.com","continueUri":"https://gogeangs.github.io/taptocity/"}'
          U="https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$K"
          a=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$B" "$U")
          b=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'X-Android-Package: kr.co.itso.taptocity' -d "$B" "$U")
          c=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Referer: https://gogeangs.github.io/taptocity/' -d "$B" "$U")
          m=$(curl -s -H 'Content-Type: application/json' -d "$B" "$U" | head -c 300 | tr '\n' ' ')
          echo "::notice title=cloud-key::머리 없음 $a · 안드로이드 $b · 웹 주소 $c · $m"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli pillow

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 그림·글꼴 복사
        run: tool/prepare_assets.sh

      # 플레이 스토어 업로드 키 (저장소 시크릿 TTC_KEYSTORE_B64·TTC_KEYSTORE_PASS·TTC_KEY_ALIAS·TTC_KEY_PASS). 없으면 미리보기용 디버그 서명
      - name: 업로드 키 준비
        if: env.HAS_KEY == 'true'
        env:
          B64: ${{ secrets.TTC_KEYSTORE_B64 }}
        run: |
          echo "$B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "TTC_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "TTC_KEYSTORE_PASS=${{ secrets.TTC_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          echo "TTC_KEY_ALIAS=${{ secrets.TTC_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "TTC_KEY_PASS=${{ secrets.TTC_KEY_PASS }}" >> "$GITHUB_ENV"

      - name: 플랫폼 폴더 만들기 (android·web)
        run: |
          flutter --version
          flutter create --org kr.co.itso --project-name taptocity --platforms android,web .
          rm -f test/widget_test.dart
          python3 tool/platform_setup.py

      # 실패하면 마지막 출력을 주석(annotation)으로 남겨, 로그를 못 여는 곳에서도 원인을 볼 수 있게 한다
      - name: 검사
        run: |
          set +e +o pipefail
          flutter pub get 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(tail -40 ../out.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=pub::$m"; exit $s; fi
          flutter analyze --no-fatal-infos 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(grep -E "error|warning" ../out.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=analyze::$m"; exit $s; fi

      - name: 테스트 (웹 버전과 같은 결과인지)
        run: |
          set +e +o pipefail
          flutter test 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(grep -vE "^\s*$|✅" ../out.txt | grep -v "^::" | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=test::$m"; exit $s; fi

      # 코드 정리 안전망 (2026-10-23): 기준 사진(test_screens/goldens)과 비교해 달라진 화면을 알린다. 기준이 없으면 건너뜀
      - name: 화면 비교 (기준 사진)
        run: |
          set +e +o pipefail
          n=$(ls test_screens/goldens/*.png 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then echo "::notice title=화면 비교::기준 사진 없음 · 건너뜀"; exit 0; fi
          rm -rf test_screens/shots && mkdir -p test_screens/shots && cp test_screens/goldens/*.png test_screens/shots/
          flutter test test_screens/screens_test.dart 2>&1 | tee ../cmp.txt; c=${PIPESTATUS[0]}
          if [ $c -ne 0 ]; then
            list=$(grep -oE "shots/[0-9]{2}-[A-Za-z0-9_-]+\.png[^)]*\([0-9.]+%\)|[0-9]{2}-[A-Za-z0-9_-]+ · " ../cmp.txt | sed 's#shots/##' | sort -u | head -40 | tr '\n' ' ')
            echo "::error title=화면 비교::기준과 달라진 화면 $n장 중 → ${list:-로그 확인}"
            echo "SHOT_DIFF=1" >> "$GITHUB_ENV"
          else
            echo "::notice title=화면 비교::기준 사진 $n장과 같아요"
          fi
          rm -rf test_screens/shots

      - name: 화면 사진
        run: |
          set +e +o pipefail
          flutter test test_screens --update-goldens 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(grep -vE "^\s*$|✅" ../out.txt | grep -v "^::" | grep -A6 "EXCEPTION CAUGHT" | head -90 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::warning title=shots::$m"; fi
          mkdir -p test_screens/shots && grep -v "^::" ../out.txt | tail -400 > test_screens/shots/log.txt
          ls test_screens/shots 2>/dev/null

      - name: 안드로이드 APK
        run: |
          set +e +o pipefail
          flutter build apk --release 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(tail -60 ../out.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=apk::$m"; exit $s; fi

      - uses: actions/upload-artifact@v4
        with:
          name: taptocity-apk
          path: native/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 스토어 제출용 번들(.aab) — 업로드 키가 있을 때만. 스토어에 올리는 일은 하지 않는다 (사람이 확인 후 Play Console에서)
      - name: 안드로이드 번들 (스토어용)
        if: env.HAS_KEY == 'true'
        run: |
          set +e +o pipefail
          flutter build appbundle --release 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(tail -60 ../out.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=aab::$m"; exit $s; fi

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: taptocity-aab
          path: native/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 웹 미리보기
        run: |
          set +e +o pipefail
          flutter build web --release --base-href /taptocity/native-play/ --pwa-strategy=none 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(tail -60 ../out.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=web::$m"; exit $s; fi
          # 엔진·그림을 받는 동안 빈 화면 대신 불러오는 중 표시 (Flutter 화면이 붙으면 사라짐)
          python3 - <<'PY'
          p='build/web/index.html'; s=open(p).read()
          ld='<style>html,body{background:#141a21;margin:0}#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e7e4dc;font:600 15px/1.4 system-ui,sans-serif}#ld i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(223,165,75,.25);border-top-color:#dfa54b;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}body:has(flutter-view) #ld{display:none}</style><div id="ld"><i></i><span>탭투시티 불러오는 중…</span></div>'
          s=s.replace('<body>','<body>'+ld,1)
          open(p,'w').write(s)
          PY

      - name: 웹 미리보기 확인 (크롬)
        run: |
          set +e +o pipefail
          mkdir -p /tmp/site/taptocity && cp -r build/web /tmp/site/taptocity/native-play
          (cd /tmp/site && nohup python3 -m http.server 8080 >/dev/null 2>&1 &)
          (cd /tmp && npm i --silent puppeteer-core@23 >/dev/null 2>&1)
          sleep 2
          mkdir -p test_screens/shots
          NODE_PATH=/tmp/node_modules node tool/web_smoke.cjs test_screens/shots > ../smoke.txt 2>&1
          if [ -s ../smoke.txt ]; then m=$(head -40 ../smoke.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::warning title=web::$m"; fi
          cp test_screens/shots/web-* /tmp/ 2>/dev/null; ls test_screens/shots

      - name: 미리보기 올리기 (native-play/)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          set +e +o pipefail
          # iOS 시뮬레이터 사진(native-play/ios-shots)은 iOS 워크플로가 올리므로 남겨 둔다
          [ -d native-play/ios-shots ] && mv native-play/ios-shots /tmp/ios-shots
          rm -rf native-play
          cp -r native/build/web native-play
          [ -d /tmp/ios-shots ] && mv /tmp/ios-shots native-play/ios-shots
          rm -rf native-play/canvaskit   # 엔진(CanvasKit)은 구글 CDN에서 받으므로 저장소에 올리지 않는다
          mkdir -p native-play/shots && cp native/test_screens/shots/*.png native/test_screens/shots/*.txt native/test_screens/shots/*.csv native-play/shots/ 2>/dev/null || true
          echo "파일 $(find native-play -type f | wc -l)개"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A native-play
          if git diff --cached --quiet; then echo "::notice title=preview::변경 없음"; exit 0; fi
          git commit -qm "네이티브 미리보기 갱신 (${GITHUB_SHA::7})"
          ok=0
          for i in 1 2 3; do
            out=$( { git pull --rebase --autostash origin main && git push origin HEAD:main; } 2>&1 ); r=$?
            if [ $r -eq 0 ]; then ok=1; break; fi
            sleep 5
          done
          m=$(echo "$out" | tail -20 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          if [ $ok -ne 1 ]; then echo "::error title=preview::$m"; exit 1; fi
          echo "::notice title=preview::올림"

      - name: 화면 비교 결과
        if: env.SHOT_DIFF == '1'
        run: |
          echo "::error title=화면 비교::화면이 기준 사진과 달라졌어요. 의도한 변경이면 native-play/shots를 native/test_screens/goldens로 복사해 기준을 새로 잡아요"
          exit 1
