# 탭투시티 iOS 스토어 정보 — ios/store 의 문구·카테고리·스크린샷을 App Store Connect에 올린다 (심사 제출은 하지 않음).
# 필요한 시크릿은 iOS 빌드와 같다: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
name: iOS store listing

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: pip install --quiet pyjwt cryptography requests
      - name: 문구·스크린샷 올리기
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 ios/store/asc_upload.py
