# 탭투시티 네이티브(Flutter) iOS — 클라우드 Mac에서 컴파일을 확인한다.
# TestFlight 업로드는 '수동 실행'에서 upload 를 켰을 때만 한다 (스토어 제출은 사람이 확인한 뒤).
# 시크릿은 기존 iOS 앱과 같다: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
name: Native iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'TestFlight로 올리기 (App Store Connect)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['native/lib/**', 'native/integration_test/**', 'native/pubspec.yaml', 'native/tool/platform_setup.py', '.github/workflows/native-ios.yml']

permissions:
  contents: write

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전 선택
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 그림·글꼴 복사
        run: |
          pip3 install --quiet --break-system-packages fonttools brotli pillow || pip3 install --quiet fonttools brotli pillow
          tool/prepare_assets.sh

      - name: iOS 폴더 만들기
        run: |
          flutter create --org kr.co.itso --project-name taptocity --platforms ios .
          rm -f test/widget_test.dart
          python3 tool/platform_setup.py
          # 번들 ID는 기존 앱과 같게 (kr.co.itso.taptocity)
          grep -m1 PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: 컴파일 확인 (서명 없이)
        run: |
          set +e +o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ../out.txt; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then m=$(tail -60 ../out.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=ios::$m"; exit $s; fi

      - name: iPhone 시뮬레이터에서 띄워 보기
        timeout-minutes: 40
        run: |
          set +e +o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,xs in d.items() if 'iOS' in r for x in xs if re.fullmatch(r'iPhone \d+( Pro)?', x['name'])]
          c.sort(key=lambda t:(t[0], ' Pro' in t[1]['name']))
          print(c[-1][1]['udid'], c[-1][1]['name'], c[-1][0].split('.')[-1], file=sys.stdout)" )
          echo "시뮬레이터: $UDID"
          UDID=${UDID%% *}
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null
          mkdir -p ios-shots
          flutter drive --driver test_driver/integration_test.dart --target integration_test/device_smoke_test.dart -d "$UDID" 2>&1 | tee ../drive.txt; s=${PIPESTATUS[0]}
          # 결과 파일에는 사진 바이트도 들어 있어 아주 크다 → 오류·기록만 남긴다
          python3 -c "
          import json
          d=json.load(open('build/integration_response_data.json'))
          json.dump({k:d.get(k) for k in ('errors','log')}, open('ios-shots/report.json','w'), ensure_ascii=False, indent=1)" 2>/dev/null
          grep -v '^\s*$' ../drive.txt | tail -60 > ios-shots/drive-log.txt
          grep -E '▶|✓|✗' ../drive.txt > ios-shots/steps.txt
          xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "Runner" AND messageType == fault' --style compact 2>/dev/null | tail -30 > ios-shots/faults.txt
          grep -q "Some tests failed" ../drive.txt && s=1
          if [ $s -ne 0 ]; then m=$(tail -60 ../drive.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'); echo "::error title=simulator::$m"; fi
          exit $s

      - name: 시뮬레이터 결과 알리기
        if: always()
        run: |
          set +e
          mkdir -p ios-shots
          # 시뮬레이터 단계가 시간 초과로 끊겨도 어디서 멈췄는지 남긴다
          [ -s ios-shots/steps.txt ] || grep -E '▶|✓|✗' ../drive.txt > ios-shots/steps.txt 2>/dev/null
          [ -s ios-shots/drive-log.txt ] || grep -v '^\s*$' ../drive.txt 2>/dev/null | tail -60 > ios-shots/drive-log.txt
          echo "::notice title=ios-shots::$(ls ios-shots 2>&1 | tr '\n' ' ')"
          [ -f ios-shots/report.json ] && echo "::notice title=report::$(head -c 3000 ios-shots/report.json | sed 's/%/%25/g')"
          [ -s ios-shots/faults.txt ] && echo "::warning title=faults::$(head -c 3000 ios-shots/faults.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"
          echo "::notice title=steps::$(tail -40 ios-shots/steps.txt 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"
          echo "::notice title=drive::$(tail -15 ios-shots/drive-log.txt 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots
          path: native/ios-shots
          if-no-files-found: warn

      - name: 시뮬레이터 사진 올리기 (native-play/ios-shots)
        if: always() && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          set +e +o pipefail
          [ -d native/ios-shots ] || { echo "::warning title=push::사진 폴더 없음"; exit 0; }
          # 빌드 폴더(ios 등)는 업로드 단계가 써야 하므로 건드리지 않고, 따로 꺼낸 작업 폴더에서 올린다
          WT="$RUNNER_TEMP/wt"
          git fetch -q origin main && git worktree add -q -f "$WT" origin/main
          cd "$WT"
          rm -rf native-play/ios-shots && mkdir -p native-play && cp -r "$GITHUB_WORKSPACE/native/ios-shots" native-play/ios-shots
          # 시뮬레이터 사진은 커서 줄여 올린다 (긴 변 1000px JPEG)
          for f in native-play/ios-shots/*.png; do [ -f "$f" ] || continue; sips -s format jpeg -s formatOptions 72 -Z 1000 "$f" --out "${f%.png}.jpg" > /dev/null && rm "$f"; done
          du -sh native-play/ios-shots
          git config http.postBuffer 157286400
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A native-play/ios-shots
          git diff --cached --quiet && { echo "::notice title=push::변경 없음"; exit 0; }
          git commit -qm "iOS 시뮬레이터 사진 (${GITHUB_SHA::7})"
          ok=0
          for i in 1 2 3; do out=$( { git pull -q --rebase origin main && git push -q origin HEAD:main; } 2>&1 ) && { ok=1; break; }; sleep 5; done
          if [ $ok -ne 1 ]; then echo "::error title=push::$(echo "$out" | tail -5 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; fi
          echo "::notice title=push::올림"

      - name: API 키 준비
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: 아카이브·TestFlight 업로드
        if: env.UPLOAD == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # 시뮬레이터 시험(flutter drive)이 Generated.xcconfig 의 FLUTTER_TARGET 을 시험 파일로 바꿔 둔다.
          # 그대로 아카이브하면 시험 앱이 올라간다(2.0.0+100 사고) → 진짜 앱(lib/main.dart)으로 다시 맞추고 확인한다
          err() { echo "::error title=$1::$(tail -40 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"; exit 1; }
          flutter build ios --release --config-only --no-codesign -t lib/main.dart > "$RUNNER_TEMP/cfg.log" 2>&1 || err config "$RUNNER_TEMP/cfg.log"
          tgt=$(grep '^FLUTTER_TARGET=' ios/Flutter/Generated.xcconfig | cut -d= -f2)
          echo "FLUTTER_TARGET=$tgt"
          case "$tgt" in *lib/main.dart) ;; *) echo "::error title=target::아카이브 대상이 lib/main.dart가 아님: $tgt"; exit 1;; esac
          if grep -q integration_test ios/Flutter/Generated.xcconfig; then echo "::error title=target::Generated.xcconfig 에 integration_test가 남아 있음"; exit 1; fi
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E 'error:|ERROR|Error' "$RUNNER_TEMP/archive.log" | tail -30 > "$RUNNER_TEMP/a.err"; tail -15 "$RUNNER_TEMP/archive.log" >> "$RUNNER_TEMP/a.err"; err archive "$RUNNER_TEMP/a.err"; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || err export "$RUNNER_TEMP/export.log"
          tail -20 "$RUNNER_TEMP/export.log"

      - name: 키 정리
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
