# XcodeGen 설정 — `xcodegen generate` 로 Taptocity.xcodeproj 를 만든다 (GitHub Actions에서 실행).
name: Taptocity
options:
  bundleIdPrefix: kr.co.itso
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Taptocity:
    type: application
    platform: iOS
    sources:
      - path: Taptocity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.itso.taptocity
        PRODUCT_NAME: Taptocity
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Taptocity/Info.plist
        ENABLE_BITCODE: NO
    info:
      path: Taptocity/Info.plist
      properties:
        CFBundleDisplayName: 탭투시티
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        WKAppBoundDomains:
          - gogeangs.github.io
          - gstatic.com
          - googleapis.com
          - firebaseapp.com
