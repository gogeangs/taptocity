#pwaHint{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;width:min(340px,calc(100% - 32px));background:#efe3c4;color:#3b2a1a;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:center;font:14px/1.45 "Gowun Dodum",system-ui,sans-serif}
#pwaHint b{display:block;font-size:14.5px}#pwaHint small{color:#6e5638}#pwaHint .x{all:unset;cursor:pointer;padding:6px;color:#6e5638}#pwaHint .go{all:unset;cursor:pointer;background:#3b2a1a;color:#efe3c4;border-radius:99px;padding:8px 12px;font-weight:700;white-space:nowrap}</style>

<body>
<title>탭투시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
@font-face{font-family:"TTC Sans";src:url(fonts/ttc-sans.woff2) format("woff2");font-weight:100 900;font-display:swap;ascent-override:102.5%;descent-override:27.5%;line-gap-override:0%}

:root{
  color-scheme:dark;
  --ink:#0d0b08; --leather:#3a2618;
  --paper:#efe3c4; --sepia:#3b2a1a; --sepia-2:#6e5638;
  --amber:#f3a53a; --glow:#ffcf7a; --rust:#b0452a;
  --serif:"Gowun Batang",Georgia,serif;
  --body:"TTC Sans","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --pen:"TTC Sans","Noto Sans KR",system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
header{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.04),transparent 40%),repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px),var(--leather);padding:10px 16px 0;position:relative;z-index:3;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1.5px dashed rgba(239,227,196,.28);border-radius:8px;padding:8px 12px}
.money{display:flex;align-items:center;gap:10px}
.coin{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#ffe2a0,var(--amber) 55%,#a8661d);box-shadow:inset 0 0 0 2px rgba(90,50,10,.5)}
.amt{font:700 24px/1 var(--serif);font-variant-numeric:tabular-nums}
.rate{font:18px/1 var(--pen);color:var(--glow);margin-top:3px}
.town{text-align:right}
.town b{display:block;font:700 17px/1.1 var(--serif)}
.town small{font-size:11.5px;color:#c9b48f;font-variant-numeric:tabular-nums}
.inkbar{grid-column:1/-1;height:5px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden}
.inkbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#c9d27a);transition:width .4s}
.tape{position:relative;margin:8px 6px -14px;background:var(--paper);color:var(--sepia);padding:6px 12px 5px;transform:rotate(-.6deg);box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;min-height:34px}
.tape::before,.tape::after{content:"";position:absolute;top:-6px;width:38px;height:14px;background:rgba(239,227,196,.55);transform:rotate(-8deg)}
.tape::before{left:-8px}.tape::after{right:-8px;transform:rotate(9deg)}
.tape .m{flex:1;font:21px/1.05 var(--pen)}
.tape .m em{font-style:normal;color:var(--rust)}
.tape .sub{display:block;font:12px var(--body);color:var(--sepia-2);margin-top:1px}
.claim{border:2px solid var(--rust);color:var(--rust);background:none;border-radius:6px;font:20px/1 var(--pen);padding:4px 8px;transform:rotate(3deg);animation:throb 1s ease-in-out infinite}
@keyframes throb{50%{transform:rotate(3deg) scale(1.08)}}
#stage{position:relative;flex:1;min-height:0;background:#0b0a0d;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:12px;top:26px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button.on{background:#f3a53a;color:#3b2a1a;border-color:#3b2a1a}
.zoom button svg{display:block;margin:auto}
.zoom button{width:34px;height:34px;border-radius:50%;background:rgba(58,38,24,.9);border:1.5px solid rgba(239,227,196,.3);color:var(--paper);font:700 17px var(--serif)}
#toast{position:absolute;left:50%;top:112px;transform:translateX(-50%) rotate(-1deg);background:var(--paper);color:var(--sepia);padding:5px 14px;font:20px var(--pen);box-shadow:0 4px 10px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;z-index:4;max-width:calc(100% - 110px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#lamp{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:96px;text-align:center;z-index:2;background:none;border:0;padding:0;color:var(--glow);touch-action:none;-webkit-touch-callout:none}
#lamp svg{width:96px;height:96px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));transition:transform .06s}
#lamp.press svg{transform:scale(.9)}
#lamp span{font:20px/1 var(--pen);color:var(--glow);text-shadow:0 1px 3px #000}
#lamp.fever svg{animation:flick .18s infinite alternate}
@keyframes flick{to{filter:drop-shadow(0 0 18px rgba(255,190,90,.9))}}
.fabs{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:2}
.fab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--paper);padding:0}
.fab .disc{width:52px;height:52px;border-radius:50%;background:var(--leather);border:2px dashed rgba(239,227,196,.35);display:grid;place-items:center;box-shadow:0 5px 12px rgba(0,0,0,.5);position:relative}
.fab svg{width:26px;height:26px}
.fab span{font:17px/1 var(--pen);white-space:nowrap;text-shadow:0 1px 3px #000}
.dot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
#ring{position:absolute;left:0;top:0;width:0;height:0;z-index:3}
.rl{position:absolute;left:0;bottom:calc(var(--R) + 34px);transform:translateX(-50%) rotate(-1deg);width:214px;background:var(--paper);color:var(--sepia);padding:9px 12px 10px;box-shadow:0 6px 16px rgba(0,0,0,.45);border-radius:2px}
.rl::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--paper);transform:translateX(-50%) rotate(45deg)}
.rl b{font:700 17px var(--serif)}
.rl i{font-style:normal;font-size:12px;color:var(--sepia-2);margin-left:6px}
.rl p{margin:4px 0 0;font:19px/1.15 var(--pen);color:#5a3f24}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid rgba(59,42,26,.35)}
.chip.g{color:#4f6e2f;border-color:#6f8f4a}.chip.w{color:#2f5f70;border-color:#5d8fa0}
.tok{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid var(--sepia);background:var(--paper);color:var(--sepia);display:grid;place-items:center;box-shadow:0 5px 12px rgba(0,0,0,.45);padding:0;animation:pop .22s cubic-bezier(.3,1.6,.5,1) both}
.tok svg{width:26px;height:26px}
.tok .cap{position:absolute;top:54px;left:50%;transform:translateX(-50%);white-space:nowrap;font:16px/1 var(--pen);color:var(--paper);text-shadow:0 1px 3px #000,0 0 6px #000}
.tok.poor{background:#cbbd9b}.tok.poor .cap{color:#f0a898}
.tok.lock{background:#6b5d49;border-color:#4a3d2c;color:#3a2f22}.tok.lock .cap{color:#bfae8f}
.tok.warn{background:var(--rust);color:var(--paper);border-color:#6d2414}
@keyframes pop{from{transform:scale(.2);opacity:0}}
#stamp{position:absolute;left:50%;top:42%;z-index:5;pointer-events:none;border:4px double var(--rust);color:var(--rust);border-radius:50%;width:170px;height:170px;margin:-85px 0 0 -85px;display:grid;place-items:center;text-align:center;background:rgba(239,227,196,.92);font-family:var(--serif)}
#stamp.go{animation:stamp 2.2s ease forwards}
#stamp b{display:block;font-size:40px;line-height:1}
#stamp span{font:24px var(--pen)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}14%{transform:scale(1) rotate(-8deg);opacity:1}80%{transform:scale(1) rotate(-8deg);opacity:1}100%{transform:scale(.95) rotate(-8deg);opacity:0}}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;z-index:6;background:var(--paper);color:var(--sepia);transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.5);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{transform:none}
#sheet:not(.open){visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
#sheet::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:radial-gradient(circle at 6px 10px,var(--paper) 6px,transparent 6.5px) 0 0/12px 10px repeat-x}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;border-bottom:1px dashed rgba(59,42,26,.3)}
.sh-head h2{margin:0;font:700 20px var(--serif)}
.sh-head button{background:none;border:0;font:26px/1 var(--pen);color:var(--sepia);padding:4px 8px}
.sh-body{overflow-y:auto;padding:10px 16px 16px;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(59,42,26,.2)}
.row .t{font:700 16px var(--serif)}
.row .t small{font:13px var(--body);color:var(--sepia-2);margin-left:4px}
.row .d{font-size:13px;color:var(--sepia-2);margin-top:3px;line-height:1.45}
.buy{min-width:80px;padding:8px 10px;border-radius:6px;border:2px solid var(--sepia);background:var(--amber);color:var(--sepia);font:700 14px var(--serif);font-variant-numeric:tabular-nums}
.buy:disabled{background:none;color:#9c8a6c;border-color:#b8a680;cursor:default}
.buy.ghost{background:none;font-family:var(--body);font-weight:400}
.buy.warn{background:var(--rust);color:var(--paper);border-color:#6d2414}
.entry{background:none;border:0;border-bottom:1px dashed rgba(59,42,26,.2);text-align:left;padding:10px 0;color:var(--sepia)}
.entry .n{font:700 14px var(--serif);color:var(--rust)}
.entry .p{font:19px/1.2 var(--pen);color:#5a3f24;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry.locked{opacity:.45;cursor:default}
#modal{position:absolute;inset:0;background:rgba(6,5,4,.72);display:flex;align-items:center;justify-content:center;padding-inline:20px;z-index:8}
.page{background:var(--paper);color:var(--sepia);max-width:360px;width:100%;max-height:88%;overflow-y:auto;padding:22px 22px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-.8deg);border-radius:2px}
.page small{font:14px var(--body);color:var(--sepia-2);margin-left:4px}
.pf{width:124px;margin:6px auto 4px}
.pf svg,.card svg,.pick svg{display:block;width:100%;height:auto}
.trait{font-size:13px;color:#4f6e2f;margin:0 0 12px;line-height:1.5}
.story{margin:0 0 14px;padding:0;list-style:none}
.story li{font:20px/1.25 var(--pen);color:#4a3320;padding:5px 0;border-bottom:1px dashed rgba(90,70,40,.22)}
.story li.lock{font:12.5px var(--body);color:#a8977a}
.tbar{height:5px;background:rgba(59,42,26,.15);border-radius:3px;overflow:hidden;margin:4px 0 10px}
.tbar i{display:block;height:100%;background:var(--amber)}
.btns{display:flex;gap:8px}.btns button{flex:1}
.page button.alt{background:none;color:var(--sepia);border:2px solid var(--sepia)}
.page button:disabled{opacity:.45}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#f7eed6;border:1.5px solid rgba(59,42,26,.22);border-radius:4px;padding:8px;text-align:left;color:var(--sepia);display:flex;flex-direction:column;gap:3px}
.card b{font:700 15px var(--serif)}
.card small{font-size:12px;color:var(--sepia-2)}
.card .st{font:17px/1.1 var(--pen);color:#6e4a2a}
.card.locked{background:#e6d8b6}
.trust{display:flex;gap:3px;margin-top:2px}.trust i{width:9px;height:9px;border-radius:50%;border:1.5px solid #c98a2c}.trust i.on{background:var(--amber);border-color:var(--amber)}
.bond{font-size:12.5px;color:var(--sepia-2);line-height:1.5;padding:2px 0}.bond b{color:var(--sepia)}.bond.on b{color:#4f6e2f}
.sec{font:700 13px var(--serif);color:var(--rust);letter-spacing:.06em;margin:10px 0 6px}
.pick{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(59,42,26,.2)}
.pick .t{font:700 15px var(--serif)}
.pick .d{font-size:12px;color:var(--sepia-2);margin-top:2px}
.badge{display:inline-block;font:11px var(--body);padding:1px 7px;border-radius:99px;background:#6f8f4a;color:#fff;margin-left:4px;vertical-align:1px}
.badge.m{background:#b8a680}
.page .tag{font:700 12px var(--serif);letter-spacing:.1em;color:var(--rust)}
.page h3{font:700 22px var(--serif);margin:6px 0 10px;text-wrap:balance}
.page p{font:22px/26px var(--pen);margin:0 0 16px;color:#4a3320;background-image:repeating-linear-gradient(transparent 0 25px,rgba(90,70,40,.2) 25px 26px)}
.page button{width:100%;padding:11px;border:0;border-radius:4px;background:var(--sepia);color:var(--paper);font:700 15px var(--serif)}
.fly{position:fixed;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe2a0,var(--amber) 60%,#a8661d);z-index:20;pointer-events:none;transition:transform .65s cubic-bezier(.5,-.3,.7,1),opacity .65s}
#skills{position:absolute;left:20px;bottom:calc(128px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:6px;z-index:2}
.sk{position:relative;width:58px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--paper);touch-action:manipulation}
.sk .av{position:relative;width:50px;height:50px;border-radius:50%;overflow:hidden;border:2.5px solid var(--amber);background:#e6d8b6;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.sk .av svg{width:50px;height:auto;margin-top:4px;display:block}
.sk .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(13,11,8,.74) calc(var(--p,0)*1turn),transparent 0);display:grid;place-items:center;font:700 14px var(--serif);color:var(--paper);text-shadow:0 1px 2px #000}
.sk.ready .av{animation:ready 1.4s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 14px 3px rgba(243,165,58,.85)}}
.sk small{font:15px/1 var(--pen);white-space:nowrap;text-shadow:0 1px 3px #000,0 0 5px #000}
.sk.empty .av{border:2px dashed rgba(239,227,196,.55);background:rgba(58,38,24,.85);display:grid;place-items:center;font:700 22px var(--serif);color:var(--paper)}
.sk.off .av{filter:grayscale(1) brightness(.6);border-color:#8a8479}
.exp{padding:10px 0;border-bottom:1px dashed rgba(59,42,26,.2)}
.exp .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.exp b{font:700 16px var(--serif)}
.exp .meta{font-size:12px;color:var(--sepia-2);white-space:nowrap}
.exp p{margin:3px 0 8px;font-size:13px;color:var(--sepia-2);line-height:1.45}
.exp.locked{opacity:.5}
.pbar{height:6px;background:rgba(59,42,26,.15);border-radius:3px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--amber);transition:width .2s}
.team{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.mem{display:flex;align-items:center;gap:6px;border:1.5px solid rgba(59,42,26,.3);border-radius:99px;padding:2px 10px 2px 2px;background:none;color:var(--sepia);font:13px var(--body)}
.mem .av{width:28px;height:28px;border-radius:50%;overflow:hidden;background:#e6d8b6;flex:none}.mem .av svg{width:28px;height:auto;margin-top:3px;display:block}
.mem.on{background:var(--amber);border-color:var(--sepia)}
.mem:disabled{opacity:.4}
.prev{font-size:12.5px;color:#4f6e2f;margin:4px 0 8px;line-height:1.55}
.skd{font-size:13px;color:#7a4a1c;margin:-6px 0 12px;line-height:1.5}
.btns{flex-wrap:wrap}
#clock{position:absolute;left:12px;top:26px;z-index:2;display:flex;align-items:center;gap:7px;background:rgba(58,38,24,.9);border:1.5px solid rgba(239,227,196,.3);border-radius:99px;padding:4px 11px 4px 6px;font:17px/1 var(--pen);color:var(--paper)}
#clock i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffe7a0,#f3a53a);box-shadow:0 0 8px rgba(243,165,58,.8)}
#clock.night i{background:transparent;box-shadow:inset -5px -2px 0 0 #efe3c4}
#clock.storm{border-color:rgba(226,100,79,.8);color:#ffd2c4}
#evBtn{position:absolute;left:12px;top:64px;z-index:3;display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--sepia);border:2px solid var(--rust);border-radius:26px;padding:3px 12px 3px 3px;box-shadow:0 5px 14px rgba(0,0,0,.5);font:18px/1.1 var(--pen);max-width:calc(100% - 80px);text-align:left;animation:bob 1.5s ease-in-out infinite}
#evBtn .av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:#e6d8b6;display:grid;place-items:center}
#evBtn .av svg{width:36px;height:auto;margin-top:6px}
#evBtn b{color:var(--rust);font-weight:400}
@keyframes bob{50%{transform:translateY(-3px)}}
.ch{display:flex;flex-direction:column;gap:8px}
.page .ch button.alt{font-weight:400}
.fx{font-size:13px;color:#4f6e2f;margin:-6px 0 14px;line-height:1.6}
@media (prefers-reduced-motion:reduce){#evBtn{animation:none}}
@media (prefers-reduced-motion:reduce){.tok,#stamp.go,.claim,#lamp.fever svg{animation:none}#sheet,.inkbar i{transition:none}}
.hud{row-gap:6px}
.town{order:-1;grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;text-align:left;gap:8px}
.mats{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.mc{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--paper)}
.mc .top{display:flex;align-items:center;gap:3px;font:700 14.5px/1 var(--serif);font-variant-numeric:tabular-nums}
.mc i{font:11px/1 var(--body);font-style:normal;color:#c9b48f}.mc svg{flex:none}
.chap{display:block;font:700 11.5px/1.3 var(--serif);letter-spacing:.04em;color:var(--rust);margin-bottom:1px}.chap i{font-style:normal;color:var(--sepia-2);font-weight:400}
.cost b{font-weight:700}
.rl:has(.lmc){width:252px}

/* ===== underground v2 look ===== */
.page.ugv2{--rock:#2a221b;--rock2:#1c1611;--lit:243,165,58;--floor:#5b4c3c;--floor2:#4c3f31;--acc:#ffcf7a;background:radial-gradient(120% 70% at 50% 0%,#2e241b,#140f0b 70%);color:#efe3c4;padding:12px 12px 10px!important;max-width:392px;width:100%;border:1.5px solid #4a3a28;border-radius:18px!important;box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:calc(100% - 12px);overflow:auto}

.ugv2 .uright{display:flex;align-items:center;gap:6px}.ugv2 .ukey{font:700 12.5px var(--body);color:#ffd98a;background:rgba(255,207,122,.14);border-radius:99px;padding:4px 9px}

.mc i{display:none!important}.mc .top{justify-content:center;font-size:14px!important}.mc .top b{font-size:inherit!important;letter-spacing:-.02em}
#pfBtn{width:34px!important;height:34px!important;border-radius:10px!important}#pfBtn svg{width:34px;height:40px}#pfBtn.lamp svg{width:24px;height:24px}
#setBtn{width:34px!important;height:34px!important;margin:0 -4px 0 0!important;flex:none}
.lvrow{display:flex!important;align-items:center;gap:8px}
.lvrow #lv{font:700 12.5px/1 var(--body)!important;color:#efe3c4;white-space:nowrap;flex:none}
.lvrow #barL{font-size:11.5px}
#pop{display:none!important}
@media (max-width:360px){.mc .top{font-size:12.5px!important}.town{gap:5px!important}.town .mats{column-gap:3px!important}.mc .top .mi,.mc .top svg{width:11px;height:11px}}
.sk small{display:none!important}.sk.off small{display:block!important}
/* one notice at a time, short */
.tt.note{padding:6px 11px 6px 8px!important}.tt.note .nb{-webkit-line-clamp:2!important;font-size:12.5px!important}.tt.note .nb b{font-size:13.5px!important}
/* one badge: a dot */
.tab.isnew .ti::before{content:""!important;top:-3px!important;left:auto!important;right:-7px!important;transform:none!important;width:10px;height:10px;padding:0!important;border-radius:50%!important;background:var(--amber)!important;box-shadow:0 0 8px var(--amber)}
.seg .nw,.stabs .seg .nw{font-size:0!important;width:8px;height:8px;padding:0!important;border-radius:50%!important;background:#e2644f!important;margin-left:5px;vertical-align:2px;display:inline-block}
/* survivor tools */
.svtools{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding:1px 1px 3px;scrollbar-width:none}.svtools::-webkit-scrollbar{display:none}
.svt{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px!important;background:#fbf4e4;border:1.5px solid rgba(59,42,26,.18);font:600 13px var(--body);color:var(--sepia);cursor:pointer;white-space:nowrap;flex:none}
.svt i{font-style:normal;font-weight:700;color:#b0452a}.svt.on{background:var(--sepia);color:#f1e5c6;border-color:var(--sepia)}.svt.on i{color:#ffd98a}
.svt .onx{background:#4f6e2f;color:#fff!important;border-radius:6px;padding:1px 5px;font-size:11px}
.svtools+.autobox,.svtools+.dutybulk{margin-top:-2px}
/* survivor page lines */
.svp .sline{display:flex;gap:8px;align-items:flex-start;font:13.5px/1.45 var(--body);padding:6px 0;border-bottom:1px dashed rgba(59,42,26,.14)}
.svp .sline>b{flex:none;width:38px;color:#b0452a;font-size:12.5px;padding-top:1px}
.dutybox .dchips{display:flex;flex-wrap:wrap;gap:5px}
.dutybox .dchip{all:unset;cursor:pointer;padding:4px 9px;border-radius:99px!important;border:1.5px solid rgba(59,42,26,.2);font:600 12.5px var(--body);color:var(--sepia)}
.dutybox .dchip.on{background:var(--sepia);color:#f1e5c6;border-color:var(--sepia)}
.dutybox .dd{display:block;margin:2px 0 0 46px;color:var(--sepia-2);font-size:12px;line-height:1.4}
.dutybox .sline{border-bottom:0}
/* costs: only what is missing stands out */
.cost.mini{font-size:11.5px!important;padding:2px 6px!important;background:transparent!important;border:1px solid rgba(59,42,26,.15)!important;color:#6b5a44!important;gap:2px}
.cost.mini u,.cost.mini::after{display:none!important}
.nr.ok.mini{font-size:12px;color:#4f6e2f}
/* expeditions */
.exp.slim .srow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.exp.slim .lootic{display:flex;gap:5px;opacity:.85}
.locklist{display:flex;flex-direction:column;gap:4px;margin-top:10px;font:12.5px/1.4 var(--body);color:var(--sepia-2);padding:9px 11px;border:1.5px dashed rgba(59,42,26,.2);border-radius:10px}

/* lantern tower card */
.tower{background:linear-gradient(160deg,#fff6dc,#f6e7c3);border:1.5px solid rgba(176,69,42,.35);border-radius:14px;padding:12px 13px;margin:0 0 12px;box-shadow:0 2px 10px rgba(224,180,65,.25)}
.tower .tt2{display:flex;justify-content:space-between;align-items:baseline}.tower .tt2 b{font:700 16px var(--serif);color:#7a3a1c}.tower .tt2 span{font:700 12px var(--body);color:var(--sepia-2)}
.tower .tsteps{display:flex;gap:4px;margin:7px 0 6px}.tower .tsteps i{flex:1;height:6px;border-radius:3px;background:rgba(59,42,26,.14)}.tower .tsteps i.on{background:#e0b441}.tower .tsteps i.cur{background:repeating-linear-gradient(90deg,#e0b441 0 4px,rgba(224,180,65,.35) 4px 8px)}
.tower>small{display:block;font:12.5px/1.45 var(--body);color:var(--sepia-2)}
.tower .treq{display:flex;flex-direction:column;gap:3px;margin:8px 0 6px}.tower .treq span{font:600 12.5px var(--body);color:#9a4a2a}.tower .treq span.ok{color:#4f6e2f}
.tower .costs{margin:4px 0 10px}.tower .buy{width:100%}
.tower.lit{background:linear-gradient(160deg,#fff8e4,#ffe9b0)}
/* confession choice */
.conf .ch{display:flex;flex-direction:column;gap:8px;margin-top:10px}.conf .ch button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;gap:2px}
.conf .ch b{font:700 14.5px var(--body)}.conf .ch small{font:12.5px/1.4 var(--body);color:var(--sepia-2);white-space:normal}
/* ending */
#ending{position:fixed;inset:0;z-index:200;background:#15110d;color:#f4e8cc;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;animation:efade .8s ease both}
#ending.out{animation:efade .6s ease reverse both}
@keyframes efade{from{opacity:0}to{opacity:1}}
#ending .esky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a3350,#15110d 70%)}
#ending .estars{position:absolute;inset:0;opacity:0;transition:opacity 2.4s ease 1s}
#ending.open .estars{opacity:1}
#ending .estars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff8e0;box-shadow:0 0 6px #fff3c8;animation:etw 2.6s ease-in-out infinite}
@keyframes etw{50%{opacity:.25}}
#ending .ecl{position:absolute;top:-10%;bottom:30%;width:70%;background:radial-gradient(circle at 60% 50%,#4a433b,#2b2620 60%,transparent 72%);filter:blur(6px);transition:transform 3s cubic-bezier(.3,.1,.2,1)}
#ending .ecl.l{left:-5%}#ending .ecl.r{right:-5%;background:radial-gradient(circle at 40% 50%,#4a433b,#2b2620 60%,transparent 72%)}
#ending.open .ecl.l{transform:translateX(-62%)}#ending.open .ecl.r{transform:translateX(62%)}
#ending .ebeam{position:absolute;left:50%;bottom:0;width:60px;height:100%;transform:translateX(-50%);background:linear-gradient(0deg,rgba(255,230,160,.65),rgba(255,230,160,0));clip-path:polygon(40% 100%,60% 100%,100% 0,0 0);opacity:.9}
#ending .escene{position:relative;max-width:340px;padding:0 22px;display:none;animation:efade .9s ease both}
#ending .escene.on{display:block}
#ending .escene p{font:500 18px/1.7 var(--serif);text-shadow:0 2px 12px #000}
#ending .ecred{max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;text-align:left;padding:6px 2px}
#ending .erow{display:flex;gap:10px;align-items:center;background:rgba(20,16,12,.55);border:1px solid rgba(244,232,204,.15);border-radius:12px;padding:6px 10px}
#ending .eav{width:40px;height:44px;flex:none;border-radius:8px;overflow:hidden;background:#e6d8b6}#ending .eav svg{width:40px;height:47px;display:block}
#ending .erow b{display:block;font:700 14px var(--body)}#ending .erow small{font:13px/1.4 var(--body);color:#e8d9b4}
#ending .epets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}#ending .epet{display:flex;flex-direction:column;align-items:center;font:12px var(--body)}#ending .epet img{width:48px;height:48px}
#ending .eletter{background:#f1e5c6;color:#3b2a1a;border-radius:6px;padding:18px 18px 16px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.6);transform:rotate(-1deg)}
#ending .eletter small{font:12px var(--body);color:#8a6a44}#ending .eletter b{display:block;font:700 18px var(--serif);margin:4px 0 8px}#ending .eletter p{font:15px/1.7 var(--serif);text-shadow:none;color:#3b2a1a}
#ending h2{font:700 22px var(--serif);margin:0 0 10px;text-shadow:0 2px 12px #000}
#ending .escene button,#ending .enext{all:unset;cursor:pointer;margin-top:16px;padding:11px 20px;border-radius:99px!important;background:#e0b441;color:#2a1c10;font:700 15px var(--body);box-shadow:0 4px 14px rgba(224,180,65,.4)}
#ending .enext{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);margin:0;background:rgba(244,232,204,.14);color:#f4e8cc;box-shadow:none;border:1px solid rgba(244,232,204,.3)}

.gslot.on{outline:2.5px solid #b0452a;outline-offset:1px}
.gpickl{margin-top:8px;border:1.5px solid rgba(176,69,42,.3);border-radius:12px;padding:8px 9px;background:#fffaf0}
.gpickl .gph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.gpickl .gph b{font:700 13.5px var(--body)}
.gpickl .gpx{all:unset;cursor:pointer;font:600 12px var(--body);color:var(--sepia-2);padding:4px 6px}
.gpr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed rgba(59,42,26,.14)}.gpr.mine{background:rgba(224,180,65,.12);border-radius:8px;padding:7px 5px}
.gpr .gpt{flex:1;min-width:0}.gpr .gpt b{display:block;font:700 13px var(--body)}.gpr .gpt small{font:12px/1.35 var(--body);color:var(--sepia-2)}
.gpr .gfit{font:700 10.5px var(--body);color:#4f6e2f}.gpr .buy{flex:none;padding:6px 11px!important;font-size:12.5px!important;min-height:0!important}
.gpe{font:12.5px var(--body);color:var(--sepia-2);padding:6px 0}
.gpmake{all:unset;cursor:pointer;display:block;margin-top:6px;font:600 12.5px var(--body);color:#b0452a;padding:4px 0}
.svhero{position:relative}.svnav{position:absolute;right:0;bottom:0;display:flex;gap:4px}
.svnav button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%!important;background:#fbf4e4;border:1.5px solid rgba(59,42,26,.2);font:700 18px/1 var(--body);color:var(--sepia)}

.gs2{display:flex!important;flex-direction:column;gap:6px}
.gs2 .gslot{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;text-align:left!important;padding:9px 11px!important;min-height:0!important;height:auto!important;width:100%!important;box-sizing:border-box}
.gs2 .gslot .gst{flex:1;min-width:0;display:flex;flex-direction:column}.gs2 .gslot .gst b{font:700 13.5px var(--body)}.gs2 .gslot .gst small{font:12px/1.35 var(--body);color:var(--sepia-2)}
.gs2 .gslot .gi{flex:none}.gs2 .gslot .gar{font-style:normal;color:var(--sepia-2);font-size:12px;flex:none}
.gs2 .gpickl{margin:-2px 0 4px}
.gpr .gpt b,.gpr .gpt small{white-space:normal;word-break:keep-all}
.gpr .buy{width:auto!important}

.gpickl .gpmake{background:transparent!important;color:#b0452a!important;box-shadow:none!important;border:0!important;padding:8px 2px 2px!important;width:auto!important;min-height:0!important;text-align:left;font:600 12.5px var(--body)!important}

html,body{overscroll-behavior:none}
.sh-body{overflow-x:hidden;overscroll-behavior:contain}
.svtools,.fchips,.segs{overscroll-behavior-x:contain}
#sheet,#modal,.page{overscroll-behavior:contain}

.mc[hidden]{display:none!important}
.bufp{position:absolute;left:12px;top:72px;z-index:2;background:rgba(58,38,24,.9);border:1.5px solid rgba(243,165,58,.55);color:#ffd98a;border-radius:99px;padding:5px 10px;font:600 12px/1 var(--body);white-space:nowrap;pointer-events:none}
.bufp[hidden]{display:none}
#stage:has(#sheet.open) #lamp,#stage:has(#sheet.open) #lampTxt,#stage:has(#sheet.open) .zoom,#stage:has(#sheet.open) #skills,#stage:has(#sheet.open) .bufp{opacity:0;pointer-events:none}
#lamp,#lampTxt,.zoom,#skills{transition:opacity .15s}
.svtools,.fchips{flex-wrap:wrap;overflow:visible}
.exp .top b::before{display:none}
.svrow .updot{width:17px;height:17px;background:#5b8a3a;box-shadow:none;display:grid;place-items:center;animation:none}
.svrow .updot::after{content:"▲";font:700 8px/1 var(--body);color:#fff}
.svnav{position:static!important;justify-content:flex-end;margin-top:8px}
.svnav button{width:36px!important;height:36px!important}
@media (max-width:360px){.tab span:last-child,.tab #sLbl,.tab #dLbl{font-size:11.5px!important}}
.store .st2 small{font-size:12px!important}

body{-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.page p,.story li,.entry .p,.page p.qsay{letter-spacing:-.01em;line-height:1.6}

.page{transform:none}
#toast{transform:translateX(-50%)}
.tape{transform:none}
.rl{transform:translateX(-50%)}
.rate{font-size:14px}
#toast{font:600 14.5px/1.3 var(--body);padding:7px 14px}
.fab span{font:700 13px/1 var(--body)}
.rl p{font:15px/1.5 var(--body)}
#stamp span{font:700 19px var(--body)}
.entry .p{font:15px/1.4 var(--body)}
.entry.log .p2{font:14.5px/1.5 var(--body)}
.page p{font:16.5px/28px var(--body);background-image:repeating-linear-gradient(transparent 0 27px,rgba(90,70,40,.16) 27px 28px)}
.page p.static{font:700 20px/1.3 var(--body)}
.page p.qsay{font:15.5px/26px var(--body)}
.ri small{font:13px/1.35 var(--body)}
/* request bubble on the map */
#evBtn{font:13px/1.2 var(--body);gap:9px;padding:4px 14px 4px 4px;border-width:1.5px;align-items:center}
#evBtn .av{width:40px;height:40px;position:relative;background:conic-gradient(var(--rust) calc(var(--p,1)*360deg),rgba(59,42,26,.15) 0);padding:3px;box-sizing:border-box}
#evBtn .av>svg{width:100%;height:100%;border-radius:50%;margin:0;background:#e6d8b6}
#evBtn .rqb{display:flex;flex-direction:column;gap:1px;min-width:0}
#evBtn .rqb small{font:600 11px/1.1 var(--body);color:var(--rust);letter-spacing:.02em}
#evBtn .rqb b{font:700 14px/1.2 var(--body);color:var(--sepia);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#evBtn.late{border-color:#b0452a;animation:rqpulse 1s ease-in-out infinite}
@keyframes rqpulse{50%{box-shadow:0 0 0 4px rgba(176,69,42,.25),0 5px 14px rgba(0,0,0,.5)}}
#stage:has(#evBtn:not([hidden])) .bufp{display:none}
/* request card */
.page.req{padding:18px 18px 16px}
.rqh{display:flex;align-items:center;gap:12px;margin:0 30px 10px 0}
.rqav{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;background:#e6d8b6;border:2px solid rgba(59,42,26,.25)}
.rqav svg{width:100%;height:auto;display:block}
.rqh h3{margin:2px 0 0;font-size:19px}
.rqtime{position:relative;height:22px;border-radius:99px;background:rgba(59,42,26,.1);overflow:hidden;margin:0 0 12px}
.rqtime i{position:absolute;inset:0;width:calc(var(--p,1)*100%);background:linear-gradient(90deg,#e8b25a,#f3a53a);border-radius:99px;transition:width 1s linear}
.rqtime b{position:relative;display:block;text-align:center;font:600 12px/22px var(--body);color:var(--sepia)}
.page.req p.rqsay{font:15.5px/1.6 var(--body);background:rgba(255,255,255,.35);border-left:3px solid var(--rust);border-radius:4px;padding:10px 12px;margin:0 0 14px;color:#4a3320}
.rqopts{display:flex;flex-direction:column;gap:10px}
.page .rqo{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;width:100%;padding:12px 14px;border-radius:12px;background:#fbf4e4;border:1.5px solid rgba(59,42,26,.22);box-shadow:0 2px 0 rgba(59,42,26,.12);cursor:pointer;text-align:left}
.page .rqo:not(.b){border-color:var(--rust);background:#fff7e6}
.page .rqo:active{transform:translateY(1px)}
.page .rqo[disabled]{opacity:.55;cursor:default}
.rqol{font:700 16px/1.3 var(--body);color:var(--sepia)}
.rqcost{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rqcost.free{font:12px var(--body);color:var(--sepia-2)}
.rqcost em{font:700 12px var(--body);color:#b0452a;font-style:normal;margin-right:2px}
.rqget{display:flex;flex-wrap:wrap;gap:5px}
.rqfx{display:inline-flex;align-items:center;gap:3px;font:600 12px/1 var(--body);color:#4f6e2f;background:rgba(111,150,70,.14);border-radius:99px;padding:5px 8px}
.rqfx.bad{color:#b0452a;background:rgba(176,69,42,.12)}
.rqget.big{margin:0 0 14px}.rqget.big .rqfx{font-size:13px;padding:6px 10px}
.page.req .rqok{width:100%}

.sq{all:unset;box-sizing:border-box;position:absolute;left:12px;top:70px;z-index:3;display:flex;align-items:center;gap:8px;width:min(300px,calc(100% - 84px));padding:4px 10px 4px 4px;border-radius:14px;background:rgba(241,229,198,.96);color:var(--sepia);border:1.5px solid rgba(59,42,26,.25);box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer}
.sq[hidden]{display:none}
.sqav{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none;background:#e6d8b6}
.sqav svg{width:100%;height:auto;display:block}
.sqm{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
.sqm small{font:600 10.5px/1.1 var(--body);color:var(--rust)}
.sqm small i{font-style:normal;color:var(--sepia-2);font-weight:400;margin-left:3px}
.sqm b{font:700 13px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqp{position:relative;flex:none;width:64px;height:18px;border-radius:99px;background:rgba(59,42,26,.12);overflow:hidden}
.sqp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c9a24a,#f3a53a);border-radius:99px}
.sqp em{position:relative;display:block;text-align:center;font:600 10.5px/18px var(--body);font-style:normal;color:var(--sepia)}
.sqgo{flex:none;font:700 13px/1 var(--body);color:#fff;background:var(--rust);border-radius:99px;padding:7px 12px;animation:sqb 1.2s ease-in-out infinite}
.sq.done{border-color:var(--rust)}
@keyframes sqb{50%{transform:scale(1.06)}}
#stage.sqon #evBtn,#stage.sqon .bufp{top:122px!important}
#stage.sqon #toasts{translate:0 52px}
#stage.sqon:has(#evBtn:not([hidden])) #toasts{translate:0 104px}
#stage:has(#sheet.open) .sq{opacity:0;pointer-events:none}

/* Visual system: a quiet field HUD around the ash-covered map. */
:root{--ink:#101012;--paper:#f5ead0;--sepia:#30281f;--sepia-2:#73634e;--leather:#29231e;--amber:#edb85b;--glow:#ffda91;--rust:#a94d35}
#app{box-shadow:0 0 0 1px rgba(255,255,255,.07),0 24px 80px rgba(0,0,0,.45)}
header{background:linear-gradient(180deg,#312920,#211e1c);padding:10px 12px 0;box-shadow:0 8px 24px rgba(0,0,0,.38)}
.hud{background:rgba(255,255,255,.035);border:1px solid rgba(255,225,174,.19)!important;border-radius:16px!important;padding:8px 10px 9px!important;gap:8px!important;box-shadow:inset 0 1px rgba(255,255,255,.055)}
.town{gap:10px!important}.town .mats{gap:2px!important}.mc{padding:4px 0 7px;min-width:0}.mc .top{color:#f8e9c8;font-family:var(--body);font-size:13px}.mc i{color:#b9aa92}
.mc::after{left:12%;right:12%;height:2px;background:linear-gradient(90deg,var(--amber) calc(var(--f,0)*100%),rgba(255,235,198,.12) 0)}
.lvrow{gap:9px!important}.lvrow #lv{color:#ffdf9e!important;font-size:12px!important}.lvrow #barL{color:#cabb9f;font-size:11px}
.inkbar{height:4px;background:rgba(0,0,0,.32)}.inkbar i{background:linear-gradient(90deg,#d98b4b,#ffd68a);box-shadow:0 0 9px rgba(255,192,91,.5)}
#setBtn{color:#ead8b9;opacity:.86}#setBtn:active{opacity:1}
.tape{margin:8px 3px -13px;padding:9px 12px;background:linear-gradient(135deg,#fff1d4,#e7d4aa);border:1px solid rgba(103,73,42,.35);border-radius:10px;box-shadow:0 6px 15px rgba(0,0,0,.32);min-height:28px}
.tape::before,.tape::after{display:none}.tape .m{font-size:13px;line-height:1.35}.tape .chap{background:#954633;border-radius:5px!important;font-size:10px!important;padding:3px 6px 2px}.tape .more{color:#8a7256}

// ---------- settings & sound ----------
const SETKEY='taptocity-settings';
const SET=(()=>{const d={snd:true,vib:true,calm:false,big:false};try{return Object.assign(d,JSON.parse(localStorage.getItem(SETKEY)||'{}'));}catch(e){return d;}})();
function applySettings(){document.body.classList.toggle('big',!!SET.big);document.body.classList.toggle('calm',!!SET.calm);try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||!!SET.calm;}catch(e){}}
function toggleSet(k){SET[k]=!SET[k];try{localStorage.setItem(SETKEY,JSON.stringify(SET));}catch(e){}applySettings();if(k==='snd'&&SET.snd)sfx('chime');if(k==='vib'&&SET.vib)buzz();renderSheet();}
let AC=null;const lastS={};
function ac(){if(!SET.snd)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return null;}return AC;}
function sfx(k){const a=ac();if(!a)return;const now=a.currentTime;if(lastS[k]&&now-lastS[k]<(k==='get'?.07:.045))return;lastS[k]=now;
  const out=a.createGain();out.gain.value=.55;out.connect(a.destination);
  const tone=(f,t0,dur,type,vol,f2)=>{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,now+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+t0+dur);
    g.gain.setValueAtTime(0,now+t0);g.gain.linearRampToValueAtTime(vol,now+t0+.008);g.gain.exponentialRampToValueAtTime(.0008,now+t0+dur);o.connect(g);g.connect(out);o.start(now+t0);o.stop(now+t0+dur+.03);};
  const noise=(t0,dur,vol,freq,q)=>{const n=Math.max(1,Math.floor(a.sampleRate*dur)),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(out);s.start(now+t0);};
  if(k==='tap'){noise(0,.08,.5,420+Math.random()*160,1.1);tone(95,0,.09,'sine',.3,48);}
  else if(k==='hit'){noise(0,.06,.35,1900+Math.random()*400,2.2);tone(560+Math.random()*140,0,.1,'triangle',.07);}
  else if(k==='get'){tone(880,0,.12,'triangle',.06);tone(1320,.05,.14,'triangle',.045);}
  else if(k==='reveal'){noise(0,.3,.14,700,.5);tone(300,0,.3,'sine',.05,600);}
  else if(k==='chime'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.55,'triangle',.07));}
  else if(k==='static'){noise(0,1,.22,1700,.35);tone(420,.25,.45,'square',.015,900);}
  else if(k==='night'){tone(110,0,1.5,'sine',.18,68);noise(0,1.1,.05,260,.5);}
  else if(k==='ui'){tone(700,0,.05,'sine',.04);}}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise(r,sc){const gw=Math.ceil(W/sc)+2,g=[];for(let i=0;i<gw*gw;i++)g.push(r());
  return(x,y)=>{const fx=x/sc,fy=y/sc,x0=fx|0,y0=fy|0,s=t=>t*t*(3-2*t),u=s(fx-x0),v=s(fy-y0),a=g[y0*gw+x0],b=g[y0*gw+x0+1],c=g[(y0+1)*gw+x0],d=g[(y0+1)*gw+x0+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}}

  for(let i=0;i<N;i++){const x=i%W,y=i/W|0;if(dist(i)<2.5)continue;if(n1(x,y)>.66)ter[i]=T.WATER;else if(n2(x,y)>.64)ter[i]=T.RUIN;}
  let p=0,g=0;while(p<14&&g++<3000){const i=(r()*N)|0;if(dist(i)>4&&dist(i)<19&&ter[i]===T.ASH){ter[i]=T.SILO;p++;}}
  [3.2,5.5,8,10.5,13,15.5,18].forEach((rad,k)=>{for(let t=0;t<400;t++){const a=r()*Math.PI*2,x=Math.round(CX+Math.cos(a)*rad),y=Math.round(CY+Math.sin(a)*rad);
    if(x<1||y<1||x>=W-1||y>=H-1)continue;const i=y*W+x;if(ter[i]!==T.WATER){ter[i]=T.DIARY;diaryAt[i]=k;break;}}});
  return{ter,diaryAt};}
const maxHp=i=>{const d=dist(i),t=S.ter[i];return Math.round((5+d*1.5)*(1+.2*(S.gen||0))*(t===T.RUIN?1.3:t===T.SILO?1.8:t===T.LM?2.2:t===T.CAR?1.2:1))};
const isSlot=i=>{const x=i%W-CX,y=(i/W|0)-CY;return Math.max(Math.abs(x),Math.abs(y))<=2;};

  S={seed,ter,diaryAt,rev:new Array(N).fill(0),hp:new Array(N).fill(-1),m:{wood:12,scrap:6,food:20},got:{},frac:{},lv:1,mods:{},walls:0,site:{},
     tapLv:0,splashLv:0,droneLv:0,found:[],mi:0,fevers:0,endT:0,t:Date.now(),clock:0,ash:{},hopeB:0,nights:0,evDone:0,shield:0,party:[],cd:{},exp:{},sv:{},asg:{},camp:{},inv:[],iu:0,ug:{best:0,runs:0,bestWith:{}}};
  for(let y=CY-2;y<=CY+2;y++)for(let x=CX-2;x<=CX+2;x++){const i=y*W+x;if(S.ter[i]===T.WATER||isSlot(i))S.ter[i]=T.ASH;}
  for(let y=CY-1;y<=CY+1;y++)for(let x=CX-1;x<=CX+1;x++)S.rev[y*W+x]=1;
  [[3,0,T.RUIN],[-1,-3,T.CAR],[-3,2,T.RUIN],[2,3,T.CRATE]].forEach(([dx,dy,t])=>{const i=(CY+dy)*W+CX+dx;S.ter[i]=t;});
  fixDiaries();placeSignals();sprinkle();}
function fixDiaries(){const have=new Set();for(const i in S.diaryAt)if(S.ter[i]===T.DIARY||S.rev[i])have.add(S.diaryAt[i]);
  for(let k=0;k<7;k++){if(have.has(k)||S.found.includes(k))continue;const rad=[3.8,5.5,8,10.5,13,15.5,18][k];for(let g=0;g<600;g++){const a=Math.random()*Math.PI*2,rr=rad+Math.floor(g/100)*.5,x=Math.round(CX+Math.cos(a)*rr),y=Math.round(CY+Math.sin(a)*rr);if(x<1||y<1||x>=W-1||y>=H-1)continue;const i=y*W+x;if(S.rev[i]||isSlot(i)||S.ter[i]!==T.ASH||(S.sig&&S.sig[i]!==undefined))continue;S.ter[i]=T.DIARY;S.diaryAt[i]=k;break;}}}
function sprinkle(){const r=mulberry(S.seed+5);S.lm={};S.trace={};
  const free=i=>!S.rev[i]&&S.ter[i]===T.ASH&&S.sig[i]===undefined&&!isSlot(i)&&dist(i)>2.5;
  const put=(type,n)=>{let c=0,g=0;while(c<n&&g++<6000){const i=(r()*N)|0;if(dist(i)>19||!free(i))continue;S.ter[i]=type;c++;}};
  put(T.CAR,40);put(T.CRATE,28);put(T.RUIN,45);
  SURV.forEach((s0,k)=>{if(s0.hidden)return;for(let g=0;g<500;g++){const i=(r()*N)|0,d=dist(i);if(d<3||d>15||!free(i))continue;S.ter[i]=T.TRACE;S.trace[i]=k;break;}});
  LMS.forEach((l,k)=>{for(let g=0;g<900;g++){const a=r()*Math.PI*2,rad=l.d+Math.floor(g/150)*.6,x=Math.round(CX+Math.cos(a)*rad),y=Math.round(CY+Math.sin(a)*rad);if(x<1||y<1||x>=W-1||y>=H-1)continue;const i=y*W+x;if(!free(i))continue;S.ter[i]=T.LM;S.lm[i]={k,ok:false};break;}});}
function placeSignals(){S.sig={};const r=mulberry(S.seed+77);
  SURV.forEach(s=>{if(s.src!=='sig'||S.sv[s.id])return;for(let t=0;t<900;t++){const a=r()*Math.PI*2,rad=s.d+Math.floor(t/150)*.8,x=Math.round(CX+Math.cos(a)*rad),y=Math.round(CY+Math.sin(a)*rad);
    if(x<1||y<1||x>=W-1||y>=H-1)continue;const i=y*W+x;if(S.rev[i]||isSlot(i)||S.ter[i]===T.WATER||S.ter[i]===T.DIARY||S.ter[i]===T.SILO||S.sig[i]!==undefined)continue;S.sig[i]=s.id;break;}});}
function load(snap){try{const raw=snap||JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.ter&&raw.ter.length===N&&raw.m){S=raw;if(!S.camp)S.camp={};try{fixDiaries();}catch(e){}if(!S.inv)S.inv=[];if(!S.ug)S.ug={best:0,runs:0,bestWith:{}};return true;}}catch(e){}fresh();return false;}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const D={E:{},hope:0,cap:60,prod:{},eat:0,green:new Array(N).fill(0),modAt:new Map(),prot:new Uint8Array(N),ready:false,wb:0,gen:0,heal:1,trustM:1,visitDisc:0,expDisc:0,tapAdd:0,hungry:false,fuelUse:0};
const nb4=i=>{const x=i%W,y=i/W|0,o=[];if(x>0)o.push(i-1);if(x<W-1)o.push(i+1);if(y>0)o.push(i-W);if(y<H-1)o.push(i+W);return o};
const isFrontier=i=>!S.rev[i]&&nb4(i).some(j=>S.rev[j]);
const revCount=()=>S.rev.reduce((a,v)=>a+v,0);
const busy=id=>{const r=S.sv[id];return!!(r&&(r.away||r.hurt>0));};
const modAtTile=i=>{const k=D.modAt.get(i);return k==null?null:S.mods[k];};
const hasMod=(id,l=0)=>Object.values(S.mods).some(m=>m.id===id&&m.l>=l);
const modLv=id=>{let l=-1;for(const k in S.mods)if(S.mods[k].id===id)l=Math.max(l,S.mods[k].l);return l;};
const wbL=()=>modLv(1)+1;
const siteLive=i=>{const s=S.site[i];return!!(s&&s.c>0&&s.k!=='lm'&&S.rev[i]);};
function asgMult(i){const id=S.asg[i];if(id==null||!S.sv[id]||busy(id))return 1;const m=modAtTile(i);return((m&&SURV[id].match.includes(m.id))?2+pw(id).w:1.3)*(1+.1*(trustLv(S.sv[id].xp)-1));}
function calcEff(){const E={scav:0,tap:0,thrift:0,hope:0,food:0,cost:0,craft:0,fever:0,global:0};
  for(const id in S.sv){if(S.sv[id].at<0||busy(+id))continue;const e=effOf(+id);for(const k in e)E[k]=(E[k]||0)+e[k];const ge=gearEff(+id);for(const k in ge)E[k]=(E[k]||0)+ge[k];}
  for(const b of BONDS)if(b.ids.every(id=>S.sv[id]))for(const k in b.eff)E[k]+=b.eff[k];
  extraEff(E);E.cost=Math.min(.5,E.cost);E.thrift=Math.min(.7,E.thrift);D.E=E;}
function recalc(){calcEff();const E=D.E;FEVER_T=6+E.fever;
  D.modAt=new Map();for(const k in S.mods)D.modAt.set(slotTile(+k),+k);
  const prod={},add=(k,v)=>prod[k]=(prod[k]||0)+v;let capAdd=0,waterRed=0,hopeM=0,genB=0,tapAdd=0,fuelUse=0;
  D.prot=new Uint8Array(N);D.heal=1;D.trustM=1;D.visitDisc=0;D.expDisc=0;D.gen=0;
  for(const k in S.mods){const m=S.mods[k],l=m.l,t=slotTile(+k),stuck=S.ash[t]&&S.ash[t].stuck,p=stuck?0:asgMult(t),q=stuck?0:1+(p-1)*.5;
    if(m.id===2)add('food',[6,14,28][l]*p);
    if(m.id===9){add('scrap',[3,6,11][l]*p);add('wood',[2,4,8][l]*p);}
    if(m.id===3){waterRed+=[.2,.35,.5][l]*q;hopeM+=[2,4,6][l];}
    if(m.id===4)capAdd+=[80,200,400][l]*q;
    if(m.id===8&&!stuck){const R=[2,3,4][l],x=t%W,y=t/W|0;for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)D.prot[yy*W+xx]=1;}tapAdd+=[.1,.15,.2][l]*q;}
    if(m.id===5&&!stuck){fuelUse+=[.6,.9,1.3][l];if((S.m.fuel||0)>0){genB+=[.25,.5,.8][l]*q;tapAdd+=[.2,.3,.4][l]*q;D.gen=l+1;}}
    if(m.id===6){D.heal=Math.max(D.heal,[2,3,4][l]*q);D.trustM=Math.max(D.trustM,1+[.1,.2,.3][l]*q);}
    if(m.id===7){D.visitDisc=Math.max(D.visitDisc,[.2,.35,.5][l]);D.expDisc=Math.max(D.expDisc,[0,.1,.2][l]);}}
  if(relicSet('hospital'))D.heal*=1.5;if(relicSet('station'))D.expDisc=Math.min(.6,D.expDisc+.1);
  const home=Object.values(S.sv).filter(r=>!r.away).length;
  D.eat=home*1*(1-E.thrift)*(1-Math.min(.7,waterRed));D.fuelUse=fuelUse;D.tapAdd=tapAdd;
  const mult=(1+E.global+genB)*(D.hungry?.5:1);
  for(const k in prod)prod[k]*=mult*(k==='food'?(1+E.food)*(lmOn('tower')?1.5:1):1);
  D.prod=prod;D.cap=Math.floor(CAP[S.lv-1]+capAdd);
  let hope=Object.keys(S.sv).length*3+E.hope+(S.hopeB||0)+hopeM+(S.lv-1)*4+(S.lm?Object.values(S.lm).filter(L=>L.ok).length*5:0);D.hope=Math.round(hope);
  const Rg=S.lv+.5;for(let i=0;i<N;i++){const dx=i%W-CX,dy=(i/W|0)-CY,d=Math.max(Math.abs(dx),Math.abs(dy));D.green[i]=d<=Rg?Math.min(1,(Rg-d+.6)/2.2):0;}
  D.ready=true;}

// ---------- effects ----------
function burst(x,y,col,n,s){for(let k=0;k<n;k++){const a=Math.random()*7,v=.6+Math.random()*2.2;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:.7+Math.random()*.5,max:1.2,col,s});}}

// ---------- stars & grade-up ----------
function starCost(id){const g=gradeOf(id),s=starOf(id),k=g+1;return scaleCost({food:8*s*k,parts:3*s*k,batt:s>=3?1:0,med:g>=2&&s>=4?1:0},1);}
const GUP=[{med:1,food:30,batt:2},{med:3,wire:2,batt:4},{med:5,wire:5,batt:6}];
function nextStep(id){const g=gradeOf(id),s=starOf(id);
  if(s<5)return{kind:'star',need:s,cost:starCost(id),label:`${s+1}성으로 강화`};
  if(g<maxGrade(id))return{kind:'grade',need:5,cost:scaleCost(GUP[g],1),label:`${GR[g+1].n} 등급으로 승급`};
  return null;}
const pctTxt=p=>`특기 효과 ×${p.m.toFixed(2)} · 딱 맞는 일터 ×${(2+p.w).toFixed(2)} · 스킬 대기 -${Math.round((1-p.cd)*100)}%`;
function promoHtml(id){const g=gradeOf(id),mg=maxGrade(id);
  let h=`<div class="grbox"><div class="grh">${gradeTag(id)}<small>최대 ${GR[mg].n} 5성</small></div><div class="d">${pctTxt(pw(id))}</div>`;
  const n=nextStep(id);
  if(n){const tl=trustLv(S.sv[id].xp),ok=tl>=n.need&&canPay(n.cost),nx=n.kind==='star'?pw(id,g,starOf(id)+1):pw(id,g+1,1);
    h+=`<div class="prm"><div class="sec2">${n.label}</div><div class="d nx">→ ${pctTxt(nx)}</div><div class="need"><div class="nr${tl>=n.need?' ok':''}"><b>신뢰도</b> ${tl}/${n.need}${tl>=n.need?' ✓':'<small>일터에 배치하거나 선물해요</small>'}</div></div>${needHtml(n.cost)}
      <button class="alt" data-act="promo" data-arg="${id}" ${ok?'':'disabled'} style="margin-top:8px">${n.kind==='star'?'성급 올리기':'등급 올리기'}</button></div>`;}
  else h+=`<div class="d" style="margin-top:4px">${GR[mg].n} 5성, 더 오를 곳이 없어요</div>`;
  return h+'</div>';}
function promote(id){const n=nextStep(id);if(!n||trustLv(S.sv[id].xp)<n.need||!pay(n.cost))return;const r=S.sv[id],s=SURV[id];
  if(n.kind==='star'){r.st=starOf(id)+1;recalc();renderSkills(true);renderSheet();save();toast(`${s.name} ${r.st}성!`);openSurv(id,true);const pf=modal.querySelector('.pf');pf&&pf.classList.add('starup');return;}
  r.g=gradeOf(id)+1;r.st=1;recalc();renderSkills(true);renderSheet();save();
  openModal(`<div class="page grade-up g${r.g}"><div class="tag">등급 승급</div><div class="pf">${portrait(s)}</div><h3>${s.name} ${gradeTag(id)}</h3><p>${[`“이 정도면 믿고 맡겨도 되겠죠?” ${s.name}의 눈빛이 달라졌어요.`,`${s.name}은(는) 이제 쉘터에 없어서는 안 될 사람이 됐어요.`,`${s.name}의 이야기는 이제 쉘터의 전설이 됐어요.`][r.g-1]}</p><div class="fx">${pctTxt(pw(id))}</div><button>좋아요</button></div>`,true);}
modal.addEventListener('click',e=>{const b=e.target.closest('[data-act="promo"]');if(!b)return;e.stopPropagation();if(!b.disabled)promote(+b.dataset.arg);},true);

// ---------- equipment: getting, equipping, crafting ----------
const BAGMAX=40;
function addGear(t,src){if(!S.inv)S.inv=[];S.iu=(S.iu||0)+1;const it={u:S.iu,t};S.inv.push(it);
  if(S.inv.length>BAGMAX){const worn=new Set(Object.values(S.sv).flatMap(r=>Object.values(r.eq||{})));const cand=S.inv.filter(x=>x!==it&&!worn.has(x.u)&&!GEAR[x.t].sig).sort((a,b)=>GEAR[a.t].g-GEAR[b.t].g)[0];if(cand){S.inv=S.inv.filter(x=>x!==cand);const G=GEAR[cand.t];give(G.cost?scaleCost(G.cost,.5):{parts:4*(G.g+1)});toast(`가방이 가득 차 ${G.n}을(를) 분해했어요`);}}if(src)toast(`${src} ${GEAR[t].n}!`);if(sheetTab==='gear')renderSheet();return it;}
function dropGear(g){const pool=Object.keys(GEAR).filter(k=>GEAR[k].g===g&&!GEAR[k].sig&&!GEAR[k].ug);return addGear(pool[(Math.random()*pool.length)|0]);}
let gearCtx={id:null,slot:null};
function openGear(id,slot){gearCtx={id,slot};closeModal();openSheet('gear');}
function equip(uid){const{id,slot}=gearCtx;const it=itemAt(uid);if(id==null||!it||GEAR[it.t].slot!==slot)return;const w=wearer(uid);if(w!=null)S.sv[w].eq[slot]=null;
  const r=S.sv[id];r.eq=r.eq||{};r.eq[slot]=uid;recalc();save();toast(`${SURV[id].name}: ${GEAR[it.t].n} 장착`);closeSheet();openSurv(id);}
function unequip(){const{id,slot}=gearCtx;const r=S.sv[id];if(r&&r.eq){r.eq[slot]=null;recalc();save();renderSheet();}}
function craftGear(t){const G=GEAR[t];if(!G.cost||wbL()<G.wb)return;const c=scaleCost(G.cost,costMult());if(!pay(c))return;const it=addGear(t);S.gearMade=(S.gearMade||0)+1;toast(`${G.n}을(를) 만들었어요`);
  if(gearCtx.id!=null&&GEAR[t].slot===gearCtx.slot&&!(S.sv[gearCtx.id].eq||{})[gearCtx.slot]){equip(it.u);return;}renderSheet();save();}
function dismantle(uid){const it=itemAt(uid);if(!it||wearer(uid)!=null)return;const G=GEAR[it.t];S.inv=S.inv.filter(x=>x.u!==uid);
  const back=G.cost?scaleCost(G.cost,.5):scaleCost({parts:4*(G.g+1),cloth:3*(G.g+1),batt:G.g>=2?1:0},1);const got=give(back);toast(`${G.n} 분해 · ${lootTxt(got)}`);renderSheet();save();}
function gearHtml(id){const q=(S.sv[id]&&S.sv[id].eq)||{};
  return`<div class="gearbox"><div class="sec2">장비 <small>일터에 있을 때 효과가 나요</small></div><div class="gslots">${SLOTK.map(sl=>{const it=q[sl]!=null&&itemAt(q[sl]);
    if(!it)return`<button class="gslot empty" data-act="gslot" data-arg="${id}:${sl}"><span class="gi"><b>+</b></span><span><b>${SLOTN[sl]}</b><small>비어 있음</small></span></button>`;
    const G=GEAR[it.t],fit=G.fit.includes(id);return`<button class="gslot" data-act="gslot" data-arg="${id}:${sl}">${gicon(it.t)}<span><b>${G.n}</b><small>${effTxt(Object.fromEntries(Object.entries(G.eff).map(([k,v])=>[k,v*(fit?1.5:1)])))}${fit?' · 잘 맞음':''}</small></span></button>`;}).join('')}</div></div>`;}
modal.addEventListener('click',e=>{const b=e.target.closest('[data-act="gslot"]');if(!b)return;e.stopPropagation();const[id,sl]=b.dataset.arg.split(':');openGear(+id,sl);},true);
function itemRow(it,act){const G=GEAR[it.t],w=wearer(it.u),id=gearCtx.id,fit=id!=null&&G.fit.includes(id);
  return`<div class="pick gear">${gicon(it.t,26)}<div><div class="t">${G.n} <span class="gr g${G.g}">${GR[G.g].n}</span>${fit?'<span class="badge">잘 맞음 ×1.5</span>':''}</div><div class="d">${effTxt(G.eff)} · ${SLOTN[G.slot]}<br><i>${G.d}</i>${w!=null?`<br><b>${SURV[w].name} 착용 중</b>`:''}${!fit&&G.fit.length?`<br>잘 맞는 사람: ${G.fit.map(f=>S.sv[f]?SURV[f].name:'???').join(', ')}`:''}</div></div>${act(it,w)}</div>`;}
function renderGear(){const{id,slot}=gearCtx;let h='';
  if(id!=null){const s=SURV[id],cur=(S.sv[id].eq||{})[slot];$('shTitle').textContent=`${s.name} · ${SLOTN[slot]}`;
    h+=`<button class="banner" data-act="gback">${portrait(s)}<span><b>${s.name}에게 돌아가기</b><br>${SLOTN[slot]} 칸을 고르는 중</span></button>`;
    const list=(S.inv||[]).filter(x=>GEAR[x.t].slot===slot).sort((a,b)=>GEAR[b.t].g-GEAR[a.t].g||(GEAR[b.t].fit.includes(id)?1:0)-(GEAR[a.t].fit.includes(id)?1:0));
    h+=`<div class="sec">가방 속 ${SLOTN[slot]} ${list.length}개</div>`;
    if(!list.length)h+=emptyHtml(`<span class="ei2">${SLOTSVG[slot]}</span>`,`${SLOTN[slot]}이 아직 없어요`,'아래에서 만들거나 폐허·원정·주파수 탐색에서 찾아요');
    for(const it of list)h+=itemRow(it,(x,w)=>x.u===cur?'<button class="buy ghost" data-act="guneq">빼기</button>':`<button class="buy" data-act="geq" data-arg="${x.u}">${w!=null?'가져오기':'장착'}</button>`);}
  else{$('shTitle').textContent=`장비 가방 ${(S.inv||[]).length}개`;
    h+='<div class="d" style="margin-bottom:6px">생존자에게 장착하려면 생존자 수첩에서 사람을 누르고 장비 칸을 눌러요. 쓰지 않는 장비는 분해해 재료를 돌려받아요.</div>';
    for(const sl of SLOTK){const list=(S.inv||[]).filter(x=>GEAR[x.t].slot===sl).sort((a,b)=>GEAR[b.t].g-GEAR[a.t].g);h+=`<div class="sec">${SLOTN[sl]} ${list.length}개</div>`;if(!list.length)h+=`<div class="emptyline">${SLOTSVG[sl]}<span>비어 있어요 · 폐허·원정·라디오에서 찾거나 아래에서 만들어요</span></div>`;
      for(const it of list)h+=itemRow(it,(x,w)=>w!=null?`<span class="dbadge">착용 중</span>`:`<button class="buy ghost" data-act="gdis" data-arg="${x.u}">분해</button>`);}}
  const rec=Object.keys(GEAR).filter(k=>GEAR[k].cost&&!GEAR[k].sig&&(slot==null||GEAR[k].slot===slot));
  h+=`<div class="sec">작업대에서 만들기${wbL()?` · 작업대 ${wbL()}단계`:''}</div>`;
  if(!wbL())h+='<div class="d">작업대를 세우면 장비를 만들 수 있어요.</div>';
  for(const k of rec){const G=GEAR[k],c=scaleCost(G.cost,costMult()),lock=wbL()<G.wb;
    h+=`<div class="row"><div><div class="t">${gicon(k,18)} ${G.n} <span class="gr g${G.g}">${GR[G.g].n}</span></div><div class="d">${effTxt(G.eff)}${lock?` · 작업대 ${G.wb}단계 필요`:''}</div>${lock?'':`<div class="costs">${costHtml(c)}</div>`}</div>${lock?'<button class="buy" disabled>잠김</button>':btnCost('gcraft',k,'만들기',c)}</div>`;}
  h+='<div class="d" style="margin-top:8px">사진·동전·하모니카·회중시계는 폐허와 원정에서, 전설 장비는 주파수 탐색에서만 나와요.</div>';
  return h;}

// Tap them (or use the lantern button), lantern towers and working survivors fight back, walls soften the blows.
let DEFN=null,DEFR={rx:220,ry:120,up:150};
const WALL_RED=[0,.3,.5,.7];
const bigNightNext=()=>{const r=REG(),p=(S.rq&&S.rq.pick==='smash')?3:(r&&r.big||3);return S.lv>=2&&ashLearned()&&((S.nightCount||0)%p===p-1);};
function startDefense(){const lv=S.lv;closeRing();if(sheetTab)closeSheet();frameDefense();DEFN={t:0,dur:80,hp:100,max:100,wave:0,foes:[],kills:0,shake:0,waveT:0,fire:0,raid:S.raid||null};S.raid=null;if(DEFN.raid)toast(`${DEFN.raid}이(가) 쳐들어와요!`);note({h:'대형 재폭풍이 몰려와요!',t:'<small>화면 어디든 두드리면 가까운 괴물을 쳐요. 손가락으로 문지르면 한꺼번에 베어요. 랜턴 버튼은 쉘터에 제일 가까운 놈을 쳐요</small>',ms:6000});sfx('night');}
function spawnWave(){const D2=DEFN,w=++D2.wave,n=3+S.lv*2+w*2,[cx,cy]=tileC(C0);
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,brute=w>=2&&Math.random()<.18+w*.08,hp=tapPow()*(brute?7:2.4)*(1+S.lv*.25);
    const ry=Math.sin(a)<0?DEFR.up:DEFR.ry;D2.foes.push({x:cx+Math.cos(a)*DEFR.rx*(.92+Math.random()*.08),y:cy+Math.sin(a)*ry*(.9+Math.random()*.1),hp,max:hp,spd:(brute?9:14+Math.random()*6)*(1+w*.06),brute,delay:k*.45+Math.random()*.6,ph:Math.random()*6,hit:0});}
  toast(w===1?'첫 번째 무리가 다가와요':w===2?'두 번째 무리! 큰 놈이 섞여 있어요':'마지막 무리예요, 버텨요!');}
function tickDefense(dt){const D2=DEFN;if(!D2)return;D2.t+=dt;D2.shake=Math.max(0,D2.shake-dt*2);
  if(D2.wave<3&&D2.t>=D2.wave*24)spawnWave();
  const[cx,cy]=tileC(C0);
  for(const f of D2.foes){if(f.delay>0){f.delay-=dt;continue;}f.hit=Math.max(0,f.hit-dt*3);const dx=cx-f.x,dy=cy-f.y,d=Math.hypot(dx,dy);
    if(d<16){f.dead=true;const dmg=(f.brute?16:7)*(1-WALL_RED[S.walls||0])*petDef();D2.hp-=dmg;D2.shake=1;buzz();sfx('hit');toast(S.walls?`재가 방벽에 부딪혔어요 · 내구도 -${Math.round(dmg)}`:`재가 쉘터를 덮쳤어요 · 내구도 -${Math.round(dmg)}`);continue;}
    f.x+=dx/d*f.spd*dt;f.y+=dy/d*f.spd*dt;}
  D2.fire+=dt;if(D2.fire>=1){D2.fire=0;
    for(const[t,k]of D.modAt){const m=S.mods[k];if(m.id!==8||(S.ash[t]&&S.ash[t].stuck))continue;const[tx,ty]=tileC(t,50),R=(2+m.l)*TW*.55;for(const f of D2.foes)if(!f.dead&&f.delay<=0&&Math.hypot(f.x-tx,(f.y-ty)*1.6)<R){hurtFoe(f,tapPow()*(1+m.l*.5));D2.beams=(D2.beams||[]).concat([{x0:tx,y0:ty,x1:f.x,y1:f.y-8,t:.25,c:'255,210,120'}]);break;}}
    for(const id in S.sv){const r=S.sv[id];if(r.at<0||busy(+id))continue;const g=ROLE[id]&&ROLE[id].includes('guard')?2:1;const[wx,wy]=tileC(r.at,16);let best=null,bd=TW*3.4;for(const f of D2.foes){if(f.dead||f.delay>0)continue;const d=Math.hypot(f.x-wx,f.y-wy);if(d<bd){bd=d;best=f;}}
      if(best&&Math.random()<.55){hurtFoe(best,tapPow()*.7*g);D2.beams=(D2.beams||[]).concat([{x0:wx,y0:wy,x1:best.x,y1:best.y-8,t:.2,c:'255,240,190'}]);}}}
  worldFight(D2,dt);
  if(D2.beams)D2.beams=D2.beams.filter(b=>(b.t-=dt)>0);if(D2.trail)D2.trail=D2.trail.filter(p=>(p.t-=dt)>0);
  D2.foes=D2.foes.filter(f=>!f.dead);
  if(D2.hp<=0)endDefense(false);else if(D2.wave>=3&&!D2.foes.length&&D2.t>50)endDefense(true);else if(D2.t>D2.dur+25)endDefense(D2.hp>0);}
function hurtFoe(f,a){if(f.dead)return;f.hp-=a;f.hit=1;if(f.hp<=0){f.dead=true;DEFN.kills++;(S.stat=S.stat||{}).foe=(S.stat.foe||0)+1;burst(f.x,f.y-8,'#ffd98a',12);burst(f.x,f.y-8,'#3a332b',10,4);if(Math.random()<.35)loot({scrap:Math.max(1,Math.round(lvScale()))},f.x,f.y-20);}}
function frameDefense(){const[cx,cy]=tileC(C0);camTw=null;const z=clampZ(Math.min(1.15,Math.max(.85,cw/360)));cam.z=z;cam.x=cx;cam.y=cy-(ch*.58-ch/2)/z;DEFR={rx:(cw/2-22)/z,ry:Math.min(ch*.58-190,ch*.42-120)/z,up:(ch*.58-200)/z};}
function strikeAt(sx,sy,first){let best=null,bd=(110*Math.max(.8,cam.z))**2;for(const f of DEFN.foes){if(f.dead||f.delay>0)continue;const s=toScreen(f.x,f.y-10),d=(s.x-sx)**2+(s.y-sy)**2;if(d<bd){bd=d;best=f;}}
  if(best){tapFoe(best);return true;}if(first){const w=toWorld(sx,sy);burst(w.x,w.y,'#c9b48f',4,2);}return false;}
function slashAt(sx,sy){const now=performance.now(),r=(46*Math.max(.8,cam.z))**2;let n=0;for(const f of DEFN.foes){if(f.dead||f.delay>0||now-(f.sl||0)<130)continue;const s=toScreen(f.x,f.y-10);if((s.x-sx)**2+(s.y-sy)**2<r){f.sl=now;hurtFoe(f,tapPow()*.8*(fever>0?2:1));glow(f.x,f.y-8,40);n++;}}
  if(n){sfx('hit');addCombo();}const w=toWorld(sx,sy);(DEFN.trail=DEFN.trail||[]).push({x:w.x,y:w.y,t:.25});}
function foeAt(sx,sy){if(!DEFN)return null;let best=null,bd=(30*cam.z+10)**2;for(const f of DEFN.foes){if(f.dead||f.delay>0)continue;const s=toScreen(f.x,f.y-10),d=(s.x-sx)**2+(s.y-sy)**2;if(d<bd){bd=d;best=f;}}return best;}
function urgentFoe(){if(!DEFN)return null;const[cx,cy]=tileC(C0);let best=null,bd=1e9;for(const f of DEFN.foes){if(f.dead||f.delay>0)continue;const d=Math.hypot(f.x-cx,f.y-cy);if(d<bd){bd=d;best=f;}}return best;}
function tapFoe(f){sfx('hit');buzz();addCombo();hurtFoe(f,tapPow()*(fever>0?2:1));glow(f.x,f.y-8,60);}
function endDefense(win){const D2=DEFN;DEFN=null;S.defs=(S.defs||0)+1;
  if(win){S.defWins=(S.defWins||0)+1;const q=Math.max(.4,D2.hp/D2.max),got=give({...scaleCost({scrap:25,parts:12,plate:5,fuel:8},lvScale()*q),batt:q>=.8?3:2});let gt='';if(Math.random()<.5+q*.3){const g=S.lv>=4?(Math.random()<.35?2:1):S.lv>=3?1:0;const it=dropGear(g);gt=` · 장비 ${GEAR[it.t].n}`;}
    if(D2.raid){const r2=give(scaleCost({scrap:30,food:25,parts:10,fuel:10},lvScale()));gt+=` · ${D2.raid}의 물자 ${lootTxt(r2)}`;}
    for(const id in S.sv)S.sv[id].xp+=25;sfx('chime');note({h:`대형 재폭풍을 막아냈어요! 내구도 ${Math.round(D2.hp)}%`,t:`<small>괴물 ${D2.kills}마리 · ${lootTxt(got)}${gt} · 모두 신뢰 +25</small>`,ms:7000});}
  else{const lost={};for(const k of BASE){const l=Math.floor((S.m[k]||0)*.15);if(l){S.m[k]-=l;lost[k]=l;}}const ks=Object.keys(S.mods);for(let q=0;q<Math.min(2,ks.length);q++){const t=slotTile(+ks[(Math.random()*ks.length)|0]);S.ash[t]={hp:tapPow()*3,max:tapPow()*3,t:0,stuck:true};}recalc();
    note({h:'쉘터가 재에 뒤덮였어요',t:`<small>잃은 자재 ${lootTxt(lost)||'없음'} · 모듈 일부가 멈췄어요. 두드려 걷어내요. 방벽과 랜턴탑을 키우면 더 잘 버텨요</small>`,ms:7500});}
  save();}
function drawFoes(time){const D2=DEFN;if(!D2)return;const[cx,cy]=tileC(C0);
  ctx.save();ctx.strokeStyle=`rgba(226,100,79,${.35+.25*Math.sin(time/200)})`;ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.beginPath();ctx.ellipse(cx,cy,34,17,0,0,7);ctx.stroke();ctx.restore();
  const uf=urgentFoe();if(uf){ctx.save();ctx.strokeStyle='rgba(255,90,60,.85)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.lineDashOffset=-time/50;ctx.beginPath();ctx.ellipse(uf.x,uf.y-10,(uf.brute?26:18),(uf.brute?18:13),0,0,7);ctx.stroke();ctx.restore();}

  for(const f of D2.foes){if(f.delay>0)continue;const s=f.brute?2:1.3,bob=reduce?0:Math.sin(time/180+f.ph)*2,x=f.x,y=f.y-10*s+bob;
    ctx.fillStyle='rgba(10,8,5,.35)';ctx.beginPath();ctx.ellipse(f.x,f.y,10*s,4*s,0,0,7);ctx.fill();
    for(let k=0;k<5;k++){const a=time/300+k*1.3+f.ph,r=(6+k%3*2)*s;ctx.fillStyle=k%2?'#2e2a26':'#45403a';ctx.beginPath();ctx.arc(x+Math.cos(a)*3*s,y+Math.sin(a)*2*s-k*1.5*s,r,0,7);ctx.fill();}
    ctx.fillStyle=f.hit>0?'#fff':'#ff5a3c';ctx.beginPath();ctx.arc(x-3*s,y-4*s,1.8*s,0,7);ctx.arc(x+3*s,y-4*s,1.8*s,0,7);ctx.fill();glowPts.push([x,y-4*s,10*s,'255,80,50',.5]);

  for(const k in S.sv){const id=+k,r=S.sv[id];let w=WALK[id];const free=!r.away&&!(r.hurt>0),working=r.at>=0;
    if(!free){delete WALK[id];continue;}

      CHAT={a,b,t:0,dur:8,lines:convo(a,b)};}

// ================= WEATHER (날씨) =================
// Rolled at every dawn. 백설화 or a 무전실 shows tomorrow's weather in advance.
const WX={normal:{n:'흐림',ic:'☁',d:'평범한 하루예요'},clear:{n:'맑음',ic:'☀',d:'폐허 뒤지기 ×1.25 · 구름 걷기 ×1.2'},acid:{n:'산성비',ic:'☂',d:'식량 생산 절반 · 뒤지기 ×0.85'},cold:{n:'한파',ic:'❄',d:'연료 소비 ×2 · 식량 소비 ×1.3'},wind:{n:'강풍',ic:'≋',d:'랜턴 피버가 1.5배 빨리 참 · 구름 걷기 ×1.1'}};
function rollWx(){const r0=REG(),w=r0&&r0.wx;if(w){let r=Math.random();for(const k in w){if(r<w[k])return k;r-=w[k];}return'normal';}const r=Math.random();return r<.4?'normal':r<.62?'clear':r<.76?'acid':r<.9?'cold':'wind';}
const wxK=()=>(S.wx&&WX[S.wx])?S.wx:'normal';
function wxMul(kind,k){const w=wxK();
  if(kind==='prod')return(w==='acid'&&k==='food'?.5:1)*regProd(k);
  if(kind==='eat')return w==='cold'?1.3:1;if(kind==='fuel')return w==='cold'?2:1;
  if(kind==='scav')return w==='clear'?1.25:w==='acid'?.85:1;if(kind==='dig')return w==='clear'?1.2:w==='wind'?1.1:1;return 1;}
const canForecast=()=>!!(S.sv[11]||hasMod(7));
function onDawn(){S.wx=S.wxNext||rollWx();S.wxNext=rollWx();S.day=(S.day||0)+1;const W1=WX[S.wx];
  note({h:`${W1.ic} 오늘의 날씨 · ${W1.n}`,t:`<small>${W1.d}${canForecast()?` · 내일은 ${WX[S.wxNext].ic} ${WX[S.wxNext].n}`:''}</small>`,ms:5000});
  allyGifts();kidsDawn();}
const wparts=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),v:.5+Math.random()*.6,s:Math.random()}));
function drawWeather(){const w=wxK();if(reduce||(w!=='acid'&&w!=='cold'&&w!=='wind'))return;
  if(w==='acid'){ctx.strokeStyle='rgba(170,200,150,.35)';ctx.lineWidth=1;ctx.beginPath();for(const p of wparts){p.y+=p.v*.02;p.x-=.004;if(p.y>1){p.y=0;p.x=Math.random();}if(p.x<0)p.x=1;ctx.moveTo(p.x*cw,p.y*ch);ctx.lineTo(p.x*cw-3,p.y*ch+10);}ctx.stroke();}
  else if(w==='cold'){ctx.fillStyle='rgba(240,245,255,.7)';for(const p of wparts){p.y+=p.v*.004;p.x+=Math.sin(p.y*20+p.s*6)*.0008;if(p.y>1){p.y=0;p.x=Math.random();}ctx.fillRect(p.x*cw,p.y*ch,1.6+p.s*1.4,1.6+p.s*1.4);}}
  else{ctx.strokeStyle='rgba(200,190,170,.28)';ctx.lineWidth=1;ctx.beginPath();for(const p of wparts){p.x+=p.v*.012;if(p.x>1){p.x=0;p.y=Math.random();}ctx.moveTo(p.x*cw,p.y*ch);ctx.lineTo(p.x*cw+14+p.s*10,p.y*ch+1);}ctx.stroke();}}

function tickDuty(){dutyT++;const ids=idleIds();if(!ids.length)return;const by={train:[],patrol:[],gather:[],care:[]};for(const id of ids)by[dutyOf(id)].push(id);

  if(!D.hungry)for(const id of by.train){const r=S.sv[id],b=trustLv(r.xp);r.xp+=.5*D.trustM;const a=trustLv(r.xp);if(a>b){svNew=true;toast(`${SURV[id].name} 신뢰도 ${a}! 새 사연이 열렸어요`);recalc();}}
  // patrol: every 3s each patroller swings at the ash closest to the shelter
  if(by.patrol.length&&dutyT%3===0){const keys=Object.keys(S.ash||{}).map(Number).filter(k=>!S.ash[k].stuck||true).sort((a,b)=>dist(a)-dist(b));
    by.patrol.forEach((id,n)=>{const i=keys[n%Math.max(1,keys.length)];if(i==null||!S.ash[i])return;const[x,y]=tileC(i,12);floatText(x,y-26,`${SURV[id].name.slice(1)} 순찰!`,'rgba(200,230,255,A)',16);hitAsh(i,tapPow()*.6);(S.stat=S.stat||{}).patrol=((S.stat||{}).patrol||0)+1;});}
  // scavenging: a small bundle every 25s each
  if(by.gather.length&&dutyT%25===0){const[x,y]=tileC(C0,30);by.gather.forEach((id,n)=>{const k=BASE[(Math.random()*BASE.length)|0],o={[k]:Math.max(1,Math.round(2.4*lvScale()))};setTimeout(()=>loot(o,x+(n-by.gather.length/2)*18,y-n*4),n*250);});}
  // caring: kids grow faster, and remember who raised them
  const growing=(S.kids||[]).filter(k=>k.g<1);
  if(by.care.length&&growing.length){const boost=Math.min(2,by.care.length)*.5/600;for(const k of growing){k.g=Math.min(1,k.g+boost);k.care=k.care||{};for(const id of by.care){const j=CARE_JOB(id);if(j)k.care[j]=(k.care[j]||0)+1;}if(k.g>=1&&!k.job){sfx('chime');setTimeout(()=>kidGrown(k),200);}}}
  else if(by.care.length&&!D.hungry)for(const id of by.care){S.sv[id].xp+=.25*D.trustM;}}

function asgScore(id,t){const m=modAtTile(t);if(!m)return 0;const p=pw(id);return(SURV[id].match.includes(m.id)?2+p.w:1.3)*p.m;}
function autoAssign(full){if(!autoOpen())return{n:0,fit:0};const tiles=[...D.modAt.keys()],free=Object.keys(S.sv).map(Number).filter(id=>!busy(id)&&!(S.sv[id].hurt>0));
  if(full){for(const t of tiles)unassign(t);for(const id of free)S.sv[id].at=-1;}
  const open=tiles.filter(t=>S.asg[t]==null),idle=free.filter(id=>S.sv[id].at<0),pairs=[];
  for(const id of idle)for(const t of open)pairs.push([asgScore(id,t),id,t]);pairs.sort((a,b)=>b[0]-a[0]);
  const usedI=new Set(),usedT=new Set();let n=0,fit=0;
  for(const[sc,id,t]of pairs){if(usedI.has(id)||usedT.has(t))continue;usedI.add(id);usedT.add(t);S.asg[t]=id;S.sv[id].at=t;n++;if(SURV[id].match.includes(modAtTile(t).id))fit++;}

function renderGuide(){const sec=(t,b)=>`<div class="gsec"><b>${t}</b>${b}</div>`;let h='';
  h+=sec('기본 조작','<p>· 빛이 새는 구름을 두드려 땅을 밝혀요. <b>꾹 누르고 있으면</b> 계속 두드려요. 화면 안에 보이는 구름까지, 한 번에 최대 30개 걷혀요. 더 걷으려면 손을 뗐다 다시 누르거나 지도를 옮겨요.<br>· 왼쪽 아래 <b>랜턴 버튼</b>은 조준한 칸(점선 원)을 두드려요.<br>· 쉬지 않고 두드리면 랜턴이 차올라 <b>피버</b>가 켜지고, 그동안 모든 수확이 두 배예요.<br>· 두 손가락으로 확대·축소, 끌어서 지도를 옮겨요.<br>· 왼쪽 위 얼굴을 누르면 내 프로필이 열려요. 이름과 초상화를 바꾸고 지금까지의 기록을 볼 수 있어요.</p>');
  h+=sec('자재와 창고','<p>· 무너진 집·폐차·상점·벙커를 두드리면 자재가 나와요. 털린 곳은 시간이 지나면 다시 쌓여요.<br>· 기본 자재 6종은 창고 한도까지만 모여요. 창고 모듈과 증축으로 늘려요.<br>· 철판·밧줄은 작업대에서 만들고, 전선·약품은 벙커·원정·지하에서 나오고, 작업대에서 조립하거나 달여 만들 수도 있어요.<br>· 남는 목재는 숯으로 구워 연료로, 남는 식량은 약초 달이기나 마을 잔치(쉘터 Lv.3)에 써요.</p>');
  h+=sec('쉘터와 모듈','<p>· 가운데 쉘터를 누르면 건설·가공·창고·꾸미기 화면이 열려요.<br>· 모듈이 일정 수 이상 있어야 증축할 수 있어요. 텃밭·고물상·창고·랜턴탑은 여러 개 지을 수 있어요.<br>· 지도의 모듈을 누르면 빠른 메뉴(강화·배치)가 떠요.</p>');
  h+=sec('생존자','<p>· 구조 신호를 따라가 잔해를 치우고 필요한 물자와 빈 침상이 있으면 구조해요.<br>· 딱 맞는 모듈에 배치하면 효과가 커지고, 일할수록 신뢰가 쌓여 사연과 개인 이야기가 열려요.<br>· 일터가 없는 사람은 ‘쉴 때 할 일’을 해요: 훈련(신뢰 절반 속도), 순찰(밤에 재 걷기), 주워 오기(자재 조금씩), 아이 돌보기(아이가 빨리 자라고 돌보는 사람을 닮아요).<br>· 쉘터 Lv.3부터 생존자 수첩의 ‘자동 배치’로 딱 맞는 사람을 한 번에 앉힐 수 있어요. 스위치를 켜 두면 빈 일터를 알아서 채워요.<br>· 쉘터 Lv.4부터 원정 탭의 ‘자동 원정’을 켜면, 쉬는 사람(순찰·아이 돌보기 제외)으로 가장 효율 좋은 팀을 꾸려 보내고 돌아오면 전리품을 알아서 챙겨요. 팀을 꾸릴 때 ‘자동 팀’ 버튼도 쓸 수 있어요.<br>· 등급: '+GR.slice(0,4).map(g=>`${g.n} ×${g.m}`).join(' · ')+' · 등급마다 1~5성, 처음 등급보다 최대 2단계까지 올라요.</p>');
  h+=sec('밤과 재폭풍','<p>· 밤마다 가장자리에 붉은 재가 쌓여요. 제때 걷어내지 않으면 땅이나 모듈을 잃어요.<br>· 세 번째 밤마다(공단은 두 번째) <b>대형 재폭풍</b>이 와요. 화면 어디든 두드리거나 문질러서 막아요. 랜턴탑·일하는 생존자·동맹이 함께 싸워요.</p>');

  h+=sec('이주','<p>· 불빛의 도시를 완성하면 새 동네로 떠날 수 있어요. 사람·장비·유물은 함께 가고, 등불의 기억(생산·두드리기 +10%)이 쌓여요.</p>');
  h+=sec('펫','<p>· 판잣집이 되고 생존자가 두 명 모이면 지도에 떠돌이 동물의 발자국이 찍혀요. 눌러서 먹이를 두고 오기를 몇 번 하면 식구가 돼요.<br>· 동행 펫 한 마리는 랜턴 곁을 따라다니며 효과를 모두 내고 재주를 부려요. 쉬는 펫은 효과가 절반이에요.<br>· 지도에서 펫을 누르면 쓰다듬고, 한 번 더 누르면 자세히 볼 수 있어요. 쓰다듬기·먹이로 친밀도가 오르면 효과가 커지고 사연이 열려요.<br>· 잘 맞는 생존자와 함께 있으면 희망이 오르고 더 빨리 친해져요. 원정·지하에도 데려갈 수 있어요.<br>· 히든 펫 3마리는 특별한 곳과 때에만 나타나요.</p>');
  return h;}

// ---------- tap the mission tape: jump straight to where the mission happens ----------
function camFly(tile,z=18){const[wx,wy]=tileC(tile,z),x0=cam.x,y0=cam.y,x1=wx,y1=wy+20,t0=performance.now(),dur=reduce?1:520;camTw=null;
  const step=now=>{if(ptrs.size)return;const p=Math.min(1,(now-t0)/dur),e=p*p*(3-2*p);cam.x=x0+(x1-x0)*e;cam.y=y0+(y1-y0)*e;clampCam();if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function pingEl(el){if(!el||el.hidden)return;el.classList.remove('ping');void el.offsetWidth;el.classList.add('ping');setTimeout(()=>el.classList.remove('ping'),1400);}
function goShelter(tab){openSheet('shelter');if(shTab!==tab){shTab=tab;$('shBody').scrollTop=0;renderSheet();}
  setTimeout(()=>{const h=document.querySelector('#shBody .hl');h&&h.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});},120);}
function goMission(){if(!modal.hidden||DEFN)return;const m=mission();
  if(m.done){pingEl($('claim'));return;}
  if(m.mig){goShelter('build');return;}
  const st=m.step,f=st?st.focus:null,hl=st&&st.hl||'',sub=m.sub;
  const toMap=()=>{if(sheetTab)closeSheet();if(ringTile>=0)closeRing();};
  const hintT=()=>{if(sub)toast(sub);};
  if(!st&&m.eg){egGo();return;}
  if(!st&&m.reg&&m.rk){regGo(m.rk);return;}
  if(!st){ // region goals
    if(/쉘터|요새|도시/.test(m.txt)){goShelter('build');return;}
    toMap();if(/재폭풍/.test(m.txt)){pingEl($('clock'));hintT();return;}
    if(aim>=0)camFly(aim,22);pingEl($('lamp'));hintT();return;}
  if(f==='center'){goShelter(hl.includes('craft')?'craft':'build');return;}
  if(f==='fExp'){openSheet('exp');setTimeout(()=>{const b=document.querySelector('#shBody [data-act="ugprep"]');b&&b.scrollIntoView({block:'center'});},120);return;}
  if(f==='conf'){openConf();return;}
  if(f==='radio'){openSheet('radio');return;}
  if(f==='fSurv'){openSheet('surv');return;}
  toMap();
  if(f==='ev'){const b=$('evBtn');if(!b.hidden)b.click();else{pingEl($('clock'));toast('부탁이 생기면 왼쪽 위에 말풍선이 떠요');}return;}
  if(f==='clock'){pingEl($('clock'));toast(isNight()?'지금이 밤이에요. 붉은 재를 두드려요':'밤이 오면 시작돼요. 시계를 봐 두세요');return;}
  if(f==='skills'){pingEl(document.querySelector('#skills .sk[data-id]'));hintT();return;}
  if(f==='lamp'){if(aim>=0)camFly(aim,22);pingEl($('lamp'));hintT();return;}
  const tg=focusTarget();if(tg&&tg.tile!=null){camFly(tg.tile,tg.z);
    if(f==='module'&&modAtTile(tg.tile))setTimeout(()=>openRing(tg.tile),560);
    else if(f==='lm'&&S.rev[tg.tile])setTimeout(()=>openRing(tg.tile),560);}
  hintT();}

// ---------- art pass: ground colour & decals, fog sprites, soft shadows, night light mask, figures ----------
const GN=(()=>{const a=new Float32Array(N);for(let i=0;i<N;i++){const x=i%W,y=i/W|0;
  a[i]=(Math.sin(x*.55+1.3)*Math.cos(y*.47-.7)+Math.sin((x+y)*.23+2.1)*.8+Math.sin((x-y)*.31)*.5+(speck[i]-.5)*.7)/2.9;}return a;})();
const C3=h=>hexRgb(h),C_D=C3('#63553f'),C_R=C3('#5b5047'),C_GD=C3('#5b8a3d'),C_GL=C3('#8fb358'),C_M=C3('#76674f'),C_M2=C3('#8a7858'),C_W1=C3('#2a6682'),C_W2=C3('#357d98');
const lerp3=(A,B,t)=>[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t];
const rgbs=(a,k=1)=>`rgb(${Math.min(255,a[0]*k)|0},${Math.min(255,a[1]*k)|0},${Math.min(255,a[2]*k)|0})`;
function groundCol(i,t,g,paved){const n=GN[i];let c;
  if(paved)c=lerp3(C_M,C_M2,.25+speck[i]*.5);
  else{const gr=lerp3(C_GD,C_GL,Math.max(0,Math.min(1,.5+n*.8)));c=lerp3(t===T.RUIN?C_R:C_D,gr,Math.min(1,g*.95));}
  return rgbs(c,1+n*.08);}
const waterCol=i=>rgbs(lerp3(C_W1,C_W2,.5+GN[i]*.6));
// grass tufts, flowers, pebbles and cracks on empty ground
function groundDecor(i,g){const s1=speck[i],s2=speck2[i];
  if(g>.3){const n=2+((s2*7)|0)%3;ctx.lineWidth=1.1;ctx.lineCap='round';
    ctx.strokeStyle=GN[i]>0?'rgba(170,205,105,.75)':'rgba(55,90,40,.55)';ctx.beginPath();
    for(let k=0;k<n;k++){const[a,b]=P(.15+((s1*97+k*.37)%1)*.7,.15+((s2*53+k*.61)%1)*.7);ctx.moveTo(a-2,b);ctx.lineTo(a-3,b-3.5);ctx.moveTo(a,b);ctx.lineTo(a,b-4.5);ctx.moveTo(a+2,b);ctx.lineTo(a+3.2,b-3.2);}ctx.stroke();
    if(s2>.84&&g>.5){const cols=['#f2d06b','#efe6d0','#d9745a'];for(let k=0;k<3;k++){const[a,b]=P(.25+((s1*31+k*.29)%1)*.5,.25+((s2*17+k*.47)%1)*.5);ctx.fillStyle=cols[(k+(s1*3|0))%3];ctx.beginPath();ctx.arc(a,b-1,1.4,0,7);ctx.fill();}}}
  else{for(let k=0;k<1+((s1*5)|0)%3;k++){const[a,b]=P(.18+((s1*7+k*.3)%1)*.64,.18+((s2*5+k*.43)%1)*.64),r=1.2+((s1*13+k)%1)*1.6;ctx.fillStyle='rgba(28,20,12,.35)';ctx.beginPath();ctx.ellipse(a+.6,b+.6,r*1.3,r*.8,0,0,7);ctx.fill();ctx.fillStyle=k%2?'#7a6c57':'#857660';ctx.beginPath();ctx.ellipse(a,b,r*1.3,r*.8,0,0,7);ctx.fill();}
    if(s2<.3){ctx.strokeStyle='rgba(30,22,14,.22)';ctx.lineWidth=.8;ctx.beginPath();const[a,b]=P(.36+s1*.15,.4),[c,d]=P(.46,.5+s2*.15),[e,f]=P(.58,.56);ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.stroke();}}}

const AO=(()=>{const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d');g.translate(64,32);g.scale(1,.5);const gr=g.createRadialGradient(0,0,4,0,0,62);gr.addColorStop(0,'rgba(12,8,4,.42)');gr.addColorStop(.6,'rgba(12,8,4,.2)');gr.addColorStop(1,'rgba(12,8,4,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,62,0,7);g.fill();return c;})();

// fog sprites: puffy ash clouds, pre-rendered once
const FOGV=8;let FOGB=null,FOGK=-1;
function mkFog(fr,seed,S2){const w=132,h=104,c=document.createElement('canvas');c.width=Math.ceil(w*S2);c.height=Math.ceil(h*S2);const g=c.getContext('2d');g.scale(S2,S2);const r=mulberry(seed),cx=w/2,cy=h*.6;
  const bl=[];for(let k=0;k<7;k++){const a=k/7*Math.PI*2+r()*.7,d=k===0?0:10+r()*12;bl.push([cx+Math.cos(a)*d*1.55,cy+Math.sin(a)*d*.62-r()*9,13+r()*9]);}
  bl.push([cx+(r()-.5)*14,cy-14-r()*6,15+r()*5]);bl.sort((a,b)=>a[1]-b[1]);
  g.fillStyle='rgba(0,0,0,.32)';for(const[x,y,rr]of bl){g.beginPath();g.ellipse(x+2,y+8,rr*1.05,rr*.75,0,0,7);g.fill();}
  const col=fr?['#3c3634','#66544a','#947257']:['#222328','#333238','#4b4646'];
  for(const[x,y,rr]of bl){const gr=g.createRadialGradient(x-rr*.35,y-rr*.5,rr*.1,x,y+rr*.2,rr*1.05);gr.addColorStop(0,col[2]);gr.addColorStop(.5,col[1]);gr.addColorStop(1,col[0]);g.fillStyle=gr;g.beginPath();g.arc(x,y,rr,0,7);g.fill();}
  if(fr){g.globalCompositeOperation='source-atop';const lg=g.createLinearGradient(0,h,0,h*.35);lg.addColorStop(0,'rgba(255,170,80,.35)');lg.addColorStop(1,'rgba(255,170,80,0)');g.fillStyle=lg;g.fillRect(0,0,w,h);}
  return c;}
// sprites are rendered at the current screen scale so drawing them is a plain 1:1 blit
function fogSprites(){const sc=dpr*cam.z,k=Math.round(Math.log(sc)/Math.log(1.12));if(k!==FOGK){FOGK=k;const S2=Math.pow(1.12,k);FOGB={s:S2,a:[[],[]]};for(let v=0;v<FOGV;v++){FOGB.a[0].push(mkFog(false,101+v*17,S2));FOGB.a[1].push(mkFog(true,101+v*17,S2));}}return FOGB;}
function nearRev(i){const x=i%W,y=i/W|0;for(let dy=-2;dy<=2;dy++){const yy=y+dy;if(yy<0||yy>=H)continue;for(let dx=-2;dx<=2;dx++){const xx=x+dx;if(xx>=0&&xx<W&&S.rev[yy*W+xx])return true;}}return false;}
function drawFogTile(i,fr,time){if(!fr&&((i%W)+(i/W|0))%2&&(LOWFX||!nearRev(i)))return;const dr=reduce?0:Math.sin(time/1700+i*.7)*1.6,[cx,cy]=P(.5,.5,11+dr),B=fogSprites(),img=B.a[fr?1:0][(speck[i]*FOGV)|0],z=cam.z,f=B.s/(dpr*z);
  const sx=((cx-66)-cam.x)*z*dpr+cw/2*dpr,sy=((cy-62)-cam.y)*z*dpr+ch/2*dpr;ctx.setTransform(1,0,0,1,0,0);

// night: darkness mask with holes punched at every light
let LC=null,LX=null;
function drawNightLight(nt){ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);
  if(nt<=.01){ctx.fillStyle='rgba(40,30,80,.08)';ctx.fillRect(0,0,cw,ch);ctx.restore();return;}
  const s=LOWFX?.25:.35,w=Math.ceil(cw*s),h=Math.ceil(ch*s);if(!LC){LC=document.createElement('canvas');LX=LC.getContext('2d');}if(LC.width!==w||LC.height!==h){LC.width=w;LC.height=h;}

  LX.globalCompositeOperation='destination-out';const z=cam.z*s;
  const hole=(x,y,r0,a0)=>{const sx=((x-cam.x)*cam.z+cw/2)*s,sy=((y-cam.y)*cam.z+ch/2)*s,r=r0*z;if(sx<-r||sy<-r||sx>w+r||sy>h+r)return;const gr=LX.createRadialGradient(sx,sy,0,sx,sy,r);gr.addColorStop(0,`rgba(0,0,0,${a0})`);gr.addColorStop(.55,`rgba(0,0,0,${a0*.55})`);gr.addColorStop(1,'rgba(0,0,0,0)');LX.fillStyle=gr;LX.fillRect(sx-r,sy-r,r*2,r*2);};
  for(const[x,y,r0,,a0]of glowPts)hole(x,y+6,r0*2.3,Math.min(.95,a0*1.7));
